window.vDeal=function(id){
  const d=fd(id);if(!d)return;const sc=calcScore(d),rk=calcRisk(d),si=D.stages.indexOf(d.stage),tasks=D.tasks.filter(t=>t.deal===id);
  const suggestion=nurtureSuggestion(d);const stks=d.stakeholders||[];const bp=d.buyerProcess||[];
  const pp=D.productProfiles?.[d.product];

  let html='<div class="ph"><div><h1 class="pt">'+d.co+'</h1><div class="ps">'+d.contact+' · '+(d.contactTitle||'')+' · '+bd(d.stage,d.stage===wonStage()?'gn':'bl')+' '+bd(d.product||'','nt')+' '+confBd(d.confidence||'medium')+'</div></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn gh" onclick="sw(\''+(cV==='det'?'nur':cV)+'\')">← Back</button><button class="btn" onclick="dealM(\''+d.id+'\')">Edit</button><button class="btn gl" onclick="actM(\''+d.id+'\')">+ Log Activity</button>'+(d.isPartnerDeal?'<button class="btn gh" onclick="genPartnerReport(\''+d.id+'\',\'product\')">📄 Partner Report</button>':'')+(d.referralPartner?'<button class="btn gh" onclick="genPartnerReport(\''+d.id+'\',\'referral\')">📄 Referral Report</button>':'')+'</div></div>';

  // Stage journey
  html+='<div class="sj">'+D.stages.map(function(s,i){return'<div class="sj-s"><div class="sj-bar" style="background:'+(i<si?'var(--accent)':i===si?'var(--gold)':'var(--line)')+'"></div><div class="sj-lab">'+s+'</div>'+(i===si?'<div class="sj-days">'+stageDays(d)+'d</div>':'')+'</div>'}).join('')+'</div>';

  // Account Health Brief
  var engScore=d.activities?.length?(d.activities[0]?dd(d.activities[0].date,today)<=7?100:dd(d.activities[0].date,today)<=14?60:dd(d.activities[0].date,today)<=21?30:10:0):0;
  var stkScore=stks.length===0?0:stks.length===1?30:stks.some(function(s){return s.role==='Decision Maker'})?100:60;
  var bpTotal=bp.length,bpDone=bp.filter(function(b){return b.status==='done'}).length,bpScore=bpTotal?Math.round(bpDone/bpTotal*100):0;
  var taskTotal=tasks.length,taskDone=tasks.filter(function(t){return tDone(t)}).length,taskScore=taskTotal?Math.round(taskDone/taskTotal*100):0;
  var refScore=(d.references||[]).length>=2?100:(d.references||[]).length===1?50:0;
  var overall=Math.round((engScore+stkScore+bpScore+taskScore+refScore)/5);
  function ahbCl(v){return v>=60?'var(--green)':v>=30?'var(--amber)':'var(--red)'}
  var warnings='';
  if(engScore<30) warnings+='<div style="color:var(--red);margin-bottom:4px">⚠ Engagement critical — contact has gone cold.</div>';
  if(stkScore<60) warnings+='<div style="color:var(--amber);margin-bottom:4px">⚠ Stakeholder coverage is thin'+(stkScore===0?' — zero mapped.':stks.length===1?' — single-threaded.':' — no decision maker.')+'</div>';
  if(bpTotal===0) warnings+='<div style="color:var(--amber);margin-bottom:4px">⚠ Buyer process not mapped.</div>';
  if(bpScore<50&&bpTotal>0) warnings+='<div style="color:var(--amber);margin-bottom:4px">⚠ Buyer process '+bpScore+'% complete.</div>';
  if(overall>=70) warnings+='<div style="color:var(--green)">✓ Well-covered. Maintain momentum.</div>';
  html+='<div class="cd" style="border-left:3px solid var(--accent)"><h3>Account Health</h3>'

window.cycleBP=function(did,idx){const d=fd(did);if(!d||!d.buyerProcess)return;const states=['unknown','pending','done'];const cur=d.buyerProcess[idx].status;d.buyerProcess[idx].status=states[(states.indexOf(cur)+1)%3];save();vDeal(did)};

// ═══ TASKS ═══
let taskView='list',calMonth=new Date().getMonth(),calYear=new Date().getFullYear();
function rTasks(ph){
  const notStarted=D.tasks.filter(t=>t.status==='not_started'&&t.due>=today);
  const inProgress=D.tasks.filter(t=>t.status==='in_progress'&&t.due>=today);
  const done=D.tasks.filter(t=>tDone(t));
  const overdue=D.tasks.filter(t=>tOverdue(t));
  const counts={all:D.tasks.length,not_started:notStarted.length,in_progress:inProgress.length,done:done.length,overdue:overdue.length};

  let list;
  if(tF==='not_started') list=notStarted;
  else if(tF==='in_progress') list=inProgress;
  else if(tF==='done') list=done;
  else if(tF==='overdue') list=overdue;
  else list=D.tasks;
  if(taskTF==='deal') list=list.filter(t=>!t.targetId);
  if(taskTF==='target') list=list.filter(t=>t.targetId);

  let html=ph+`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px">
    <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
      <div class="fl" style="margin-bottom:0">
        <button class="ch ${tF==='all'?'on':''}" onclick="tF='all';rv('tasks')">All (${counts.all})</button>
        <button class="ch ${tF==='not_started'?'on':''}" onclick="tF='not_started';rv('tasks')">Not Started (${counts.not_started})</button>
        <button class="ch ${tF==='in_progress'?'on':''}" onclick="tF='in_progress';rv('tasks')">In Progress (${counts.in_progress})</button>
        <button class="ch ${tF==='done'?'on':''}" onclick="tF='done';rv('tasks')">Done (${counts.done})</button>
        ${counts.overdue?`<button class="ch ${tF==='overdue'?'on':''}" onclick="tF='overdue';rv('tasks')" style="${tF!=='overdue'?'border-color:var(--red);color:var(--red)':''}">Overdue (${counts.overdue})</button>`:''}
      </div>
      <div style="border-left:1px solid var(--line);height:20px;margin:0 2px"></div>
      <div class="fl" style="margin-bottom:0"><button class="ch ${taskTF==='all'?'on':''}" onclick="taskTF='all';rv('tasks')">All Types</button><button class="ch ${taskTF==='deal'?'on':''}" onclick="taskTF='deal';rv('tasks')">Deal</button><button class="ch ${taskTF==='target'?'on':''}" onclick="taskTF='target';rv('tasks')">Target</button></div>
      <div style="border-left:1px solid var(--line);height:20px;margin:0 2px"></div>
      <div class="fl" style="margin-bottom:0"><button class="ch ${taskView==='list'?'on':''}" onclick="taskView='list';rv('tasks')">☰ List</button><button class="ch ${taskView==='cal'?'on':''}" onclick="taskView='cal';rv('tasks')">▦ Calendar</button></div>
    </div>
    <button class="btn gl" onclick="taskM()">+ Add Task</button></div>`;

  if(taskView==='cal'){
    html+=renderCalendar();
  } else {
    html+=list.length?list.sort((a,b)=>{
      const aO=tOverdue(a)?0:a.status==='in_progress'?1:a.status==='not_started'?2:3;
      const bO=tOverdue(b)?0:b.status==='in_progress'?1:b.status==='not_started'?2:3;
      return aO-bO||(a.due>b.due?1:-1);
    }).map(t=>{const d=fd(t.deal);const isO=tOverdue(t);const isDone=tDone(t);
      const tgt=t.targetId?(D.prospectTargets||[]).find(x=>x.id===t.targetId):null;
      const typeBd=tgt?'<span style="font-size:9px;padding:2px 6px;border-radius:3px;background:#C9A86A22;color:#8A7144;font-weight:600;margin-left:6px">Target</span>':'<span style="font-size:9px;padding:2px 6px;border-radius:3px;background:#0E1B3815;color:#0E1B38;font-weight:600;margin-left:6px">Deal</span>';
      return`<div class="ac ${isO?'rd':isDone?'gn':t.status==='in_progress'?'am':''}">
        <div class="ac-h">
          <div style="display:flex;align-items:center;gap:8px">
            <button style="width:22px;height:22px;border-radius:4px;border:1.5px solid ${isDone?'var(--green)':'var(--lineS)'};background:${isDone?'var(--green)':'transparent'};color:#fff;font-size:12px;cursor:pointer;display:grid;place-items:center" onclick="cTask('${t.id}')">${isDone?'✓':''}</button>
            <span class="ac-t" style="${isDone?'text-decoration:line-through;opacity:.5':''}">${t.title.replace(/^\[Target\] /,'')}</span>${typeBd}
          </div>
          <div style="display:flex;gap:4px;align-items:center">
            ${(t.extensions||[]).length?`<span style="font-size:9px;color:var(--amber);font-weight:600" title="${(t.extensions||[]).map(e=>e.reason+': '+e.oldDate+' → '+e.newDate).join('\\n')}">↻${(t.extensions||[]).length}x extended</span>`:''}
            ${bd(TASK_ST_LABEL[t.status],TASK_ST_BD[t.status])}
            ${isO?bd('Overdue','rd'):''}
            ${pBd(t.priority)}
            ${!isDone?`<button class="rb" style="padding:2px 6px;font-size:10px" onclick="extendTaskM('${t.id}')">Extend</button>`:''}
            <button class="rb" style="padding:2px 6px;font-size:10px" onclick="taskM('${t.id}')">✎</button>
          </div>
        </div>
        <div class="ac-m">${d?`<span style="cursor:pointer" onclick="vDeal('${d.id}')">${d.co}</span>`:tgt?`<span style="cursor:pointer" onclick="vTgt('${tgt.id}')">${tgt.co}</span>`:''}<span>Due: ${t.due}</span>${isO?`<span style="color:var(--red);font-weight:600">Missed by ${dd(t.due,today)}d</span>`:''}</div>
      </div>`}).join(''):'<div class="empty">No tasks in this filter.</div>';
  }
  $('#p-tasks').innerHTML=html;
}

function renderCalendar(){
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const firstDay=new Date(calYear,calMonth,1).getDay(); // 0=Sun
  const monthName=new Date(calYear,calMonth).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  const dayNames=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

  // Get tasks for this month (filter by current tF)
  const allTasks=tF==='not_started'?D.tasks.filter(t=>t.status==='not_started'&&t.due>=today):tF==='in_progress'?D.tasks.filter(t=>t.status==='in_progress'&&t.due>=today):tF==='done'?D.tasks.filter(t=>tDone(t)):tF==='overdue'?D.tasks.filter(t=>tOverdue(t)):D.tasks;
  const tasksByDay={};
  allTasks.forEach(t=>{
    const td=new Date(t.due);
    if(td.getMonth()===calMonth&&td.getFullYear()===calYear){
      const day=td.getDate();
      if(!tasksByDay[day])tasksByDay[day]=[];
      tasksByDay[day].push(t);
    }
  });

  let html=`<div class="cd" style="padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <button class="rb" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--}rv('tasks')">← Prev</button>
      <h3 style="margin:0;font-size:16px">${monthName}</h3>
      <button class="rb" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++}rv('tasks')">Next →</button>
    </div>
    <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:6px;overflow:hidden">`;

  // Day headers
  dayNames.forEach(d=>{
    html+=`<div style="background:#faf8f3;padding:8px 4px;text-align:center;font-size:10px;font-weight:600;color:var(--ink2)">${d}</div>`;
  });

  // Empty cells before first day
  for(let i=0;i<firstDay;i++){
    html+=`<div style="background:var(--card);padding:6px;min-height:90px"></div>`;
  }

  // Day cells
  const todayDate=new Date();
  const isCurrentMonth=todayDate.getMonth()===calMonth&&todayDate.getFullYear()===calYear;

  for(let d=1;d<=daysInMonth;d++){
    const dateStr=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday=isCurrentMonth&&todayDate.getDate()===d;
    const isPast=dateStr<today;
    const tasks=tasksByDay[d]||[];
    const hasOverdue=tasks.some(t=>tOverdue(t));

    html+=`<div style="background:${isToday?'#f0ede4':'var(--card)'};padding:6px;min-height:90px;vertical-align:top">
      <div style="font-size:11px;font-weight:${isToday?700:500};color:${isToday?'var(--accent)':'var(--ink)'};margin-bottom:4px;display:flex;justify-content:space-between;align-items:center">
        <span${isToday?' style="background:var(--accent);color:#fff;width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px"':''}>${d}</span>
        ${tasks.length?`<span style="font-size:9px;font-weight:600;color:${hasOverdue?'var(--red)':'var(--ink3)'}">·${tasks.length}</span>`:''}
      </div>
      ${tasks.slice(0,3).map(t=>{
        const dl=fd(t.deal);const isO=tOverdue(t);const isDone=tDone(t);
        const clr=isDone?'var(--green)':isO?'var(--red)':t.status==='in_progress'?'var(--amber)':t.priority==='urgent'?'var(--red)':t.priority==='high'?'var(--amber)':'var(--accent)';
        return`<div style="font-size:9px;line-height:1.3;padding:2px 4px;margin-bottom:2px;border-radius:3px;background:${isDone?'var(--gbg)':isO?'var(--rbg)':t.status==='in_progress'?'var(--abg)':'#f0ede4'};border-left:2px solid ${clr};cursor:pointer;overflow:hidden;white-space:nowrap;text-overflow:ellipsis" onclick="taskM('${t.id}')" title="${t.title}${dl?' — '+dl.co:''}">
          <span style="color:${clr};font-weight:500">${isDone?'✓ ':''}${t.title.slice(0,25)}${t.title.length>25?'…':''}</span>
          ${dl?`<div style="color:var(--ink3);font-size:8px">${dl.co}</div>`:''}
        </div>`;
      }).join('')}
      ${tasks.length>3?`<div style="font-size:8px;color:var(--ink3);padding:1px 4px">+${tasks.length-3} more</div>`:''}
    </div>`;
  }

  // Empty cells after last day
  const totalCells=firstDay+daysInMonth;
  const remaining=totalCells%7===0?0:7-totalCells%7;
  for(let i=0;i<remaining;i++){
    html+=`<div style="background:#faf8f3;padding:6px;min-height:90px"></div>`;
  }

  html+=`</div></div>`;
  return html;
}

  save();clM();rAll();toast('Deadline extended');
};

window.printAction=function(){
  // Save notes first
  if(!D.actionNotes)D.actionNotes={};
  var execEl=document.getElementById('ap-exec');if(execEl)D.actionNotes._exec=execEl.value;
  const pipe=D.deals.filter(d=>d.stage!==wonStage());
  pipe.forEach(function(d){var el=document.getElementById('ap-'+d.id);if(el)D.actionNotes[d.id]=el.value});
  save();
  const scored=pipe.map(d=>({d,urgency:calcUrgency(d),sc:calcScore(d),rk:calcRisk(d),suggestion:nurtureSuggestion(d)})).sort((a,b)=>b.urgency-a.urgency);
  const totalP=pipe.reduce((s,d)=>s+d.arr,0);
  const highRisk=pipe.filter(d=>calcRisk(d)==='high').length;
  const overdueTasks=D.tasks.filter(t=>!tDone(t)&&tOverdue(t)).length;
  const todayActions=pipe.filter(d=>d.nextAction===today).length;

  const dealCards=scored.map(function({d,urgency,sc,rk,suggestion},idx){
    const tasks=D.tasks.filter(t=>t.deal===d.id&&!tDone(t)).sort((a,b)=>a.due<b.due?-1:1);
    const rkColor=rk==='high'?'#b04540':rk==='medium'?'#c47e2a':'#4a7c59';
    const rkBg=rk==='high'?'#fdf0ef':rk==='medium'?'#fdf6ee':'#f0f5f0';
    const scColor=sc>=70?'#4a7c59':sc>=40?'#c47e2a':'#b04540';
    let card='<div class="deal" style="border-left:4px solid '+rkColor+'">';
    // Header
    card+='<div class="deal-hdr"><div class="deal-num">'+String(idx+1)+'</div><div class="deal-hdr-mid"><div class="deal-name">'+d.co+'</div>'
      +'<div class="deal-sub"><strong>'+d.product+'</strong>'+(d.isPartnerDeal?' · via '+d.partner:'')+(d.referralPartner?' · ref: '+d.referralPartner:'')+' · '+d.contact+(d.contactTitle?' · '+d.contactTitle:'')+'</div></div>'
      +'<div class="deal-hdr-rhs"><div class="deal-arr">'+fc(d.arr)+'</div><div style="font-size:9px;color:#888;text-align:right">Your: '+fc(netRev(d))+'</div>'
      +'<div class="deal-badges"><span class="badge b">'+d.stage+'</span> <span class="badge" style="background:'+rkBg+';color:'+rkColor+'">'+rk+'</span> <span style="color:'+scColor+';font-weight:700;font-size:11px">'+sc+'</span></div></div></div>';
    // Contact row
    card+='<div class="contact-row">';
    if(d.contactPhone) card+='<span>📞 '+d.contactPhone+'</span>';
    if(d.contactPhone) card+='<span>💬 <a href="https://wa.me/'+d.contactPhone.replace(/[^0-9]/g,'')+'" style="color:#25D366">WhatsApp</a></span>';
    if(d.contactEmail) card+='<span>✉ '+d.contactEmail+'</span>';
    card+='</div>';
    // Win theme

    if(d.dealContext) card+='<div class="intel"><strong>📋 Context:</strong> '+d.dealContext+'</div>';
    // Action box
    card+='<div class="action"><div class="action-label">NEXT MOVE</div><div class="action-text">'+suggestion.icon+' '+suggestion.text.slice(0,350)+(suggestion.text.length>350?'…':'')+'</div></div>';
    // Tasks
    if(tasks.length){
      card+='<div class="tasks"><strong>Open tasks:</strong> ';
      tasks.slice(0,5).forEach(function(t){
        var cls=t.due<today?'task od':'task';
        card+='<span class="'+cls+'">'+t.title+' ('+t.due+')</span>';
      });
      if(tasks.length>5) card+='<span class="task">+'+String(tasks.length-5)+' more</span>';
      card+='</div>';
    }
    // Notes
    var note=D.actionNotes?.[d.id];
    if(note) card+='<div class="note"><strong>Notes:</strong> '+note+'</div>';
    card+='</div>';
    return card;
  }).join('');

window.saveDeal=function(id){
  const isPartner=$('#f-ip').value==='yes';
  const revType=$('#f-rt').value;
  const partnerBase=revType==='partner_share'?(+$('#f-pbp').value||0):0;
  const yourMarkup=revType==='partner_share'?(+$('#f-ym').value||0):(+$('#f-arr').value||0);
  const newStage=$('#f-st').value;
  const obj={co:$('#f-co').value,contact:$('#f-ct').value,contactTitle:$('#f-ctt').value,contactPhone:$('#f-ctp').value,contactEmail:$('#f-cte').value,stage:newStage,arr:+$('#f-arr').value||0,confidence:$('#f-conf').value,revenueType:revType,partnerBasePrice:partnerBase,yourMargin:yourMarkup,marginPct:0,src:$('#f-src').value,product:$('#f-pr').value,isPartnerDeal:isPartner,partner:isPartner?($('#f-pn').value||''):'',referralPartner:$('#f-rp').value||'',referralFee:+$('#f-rfee').value||0,nextAction:$('#f-na').value,created:$('#f-cr').value,notes:$('#f-n').value,dealContext:$('#f-dctx').value,competitive:$('#f-comp').value,winTheme:$('#f-wt').value};
  if(id){
    const existing=fd(id);
    // Detect stage change → reset stageEnteredDate
    if(existing.stage!==newStage) obj.stageEnteredDate=today;
    else obj.stageEnteredDate=existing.stageEnteredDate||today;
    Object.assign(existing,obj);
  }else{
    obj.id='D-'+String(D.deals.length+1).padStart(3,'0');obj.stageEnteredDate=today;obj.stakeholders=[];obj.buyerProcess=[];obj.activities=[];D.deals.push(obj);
  }
  save();clM();rAll();toast(id?'Updated':'Created');
};

window.saveAct=function(did){
  const d=fd(did);if(!d){toast('Deal not found');return}
  const typeEl=$('#fa-t'),dateEl=$('#fa-d'),noteEl=$('#fa-n');
  if(!typeEl||!dateEl||!noteEl){toast('Form error — try again');return}

function rRev(ph){
  const all=D.deals;
  const earned=all.filter(d=>isActualRev(d));
  const forecast=all.filter(d=>isForecast(d));
  const pipeline=all.filter(d=>isPipeline(d));
  const early=all.filter(d=>isEarlyStage(d));

  // Portfolio-level totals
  const pipelinePlus=all.filter(d=>isPipeline(d)||isForecast(d)||isActualRev(d));
  const totalDealValue=pipelinePlus.reduce((s,d)=>s+d.arr,0);
  const totalPartnerPortion=pipelinePlus.reduce((s,d)=>s+(d.arr-expRev(d)),0);
  const totalGrossRev=pipelinePlus.reduce((s,d)=>s+expRev(d),0);
  const totalRefComm=pipelinePlus.reduce((s,d)=>s+refComm(d),0);
  const totalNetRev=pipelinePlus.reduce((s,d)=>s+netRev(d),0);

  // Per-category nets
  const earnedNet=earned.reduce((s,d)=>s+netRev(d),0);
  const forecastNet=forecast.reduce((s,d)=>s+netRev(d),0);
  const pipelineNet=pipeline.reduce((s,d)=>s+netRev(d),0);
  const earlyNet=early.reduce((s,d)=>s+netRev(d),0);

  let html=ph;

  // Section 1: Portfolio Revenue Waterfall
  const wfMax=totalDealValue||1;
  html+='<div class="cd" style="margin-bottom:20px"><h3>Portfolio Revenue Waterfall</h3>';
  html+='<div class="ds">How total deal value becomes your net revenue — across all '+all.length+' deals</div>';
  html+='<div style="margin-top:14px">';
  // Each waterfall row
  var wfRows=[
    {label:'Total Deal Value',value:totalDealValue,color:'var(--accent)',sub:'Sum of all deal values'},
    {label:'Partner Portions',value:totalPartnerPortion,color:'var(--ink3)',sub:'Revenue retained by product partners',neg:true},
    {label:'Your Gross Revenue',value:totalGrossRev,color:'var(--warm)',sub:'Deal value × your share %'},
    {label:'Referral Commissions',value:totalRefComm,color:'var(--amber)',sub:'% of deal value, paid to referrers',neg:true},
    {label:'Your Net Revenue',value:totalNetRev,color:'var(--green)',sub:'What SOE actually keeps'}
  ];
  wfRows.forEach(function(r){
    var pct=Math.max(Math.round(r.value/wfMax*100),2);
    html+='<div style="display:flex;align-items:center;gap:12px;margin-bottom:8px">';
    html+='<div style="width:160px;text-align:right;font-size:12px;font-weight:500;color:var(--ink)">'+(r.neg?'− ':'')+r.label+'</div>';
    html+='<div style="flex:1;position:relative;height:28px;background:var(--line);border-radius:4px;overflow:hidden">';
    html+='<div style="width:'+pct+'%;height:100%;background:'+r.color+';border-radius:4px;display:flex;align-items:center;padding:0 10px">';
    html+='<span style="font-size:11px;font-weight:600;color:#fff;white-space:nowrap">'+fc(r.value)+'</span>';
    html+='</div></div>';
    html+='<div style="width:80px;font-size:10px;color:var(--ink3)">'+r.sub+'</div>';
    html+='</div>';
  });
  html+='</div></div>';

  // Section 2: Summary cards
  html+='<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px">';
  html+='<div class="st g" style="cursor:default"><div class="st-l">Actual Revenue</div><div class="st-v">'+fc(earnedNet)+'</div><div class="st-m">'+earned.length+' deals ('+D.targets.actualRevenueFrom+'+)</div></div>';
  html+='<div class="st" style="cursor:default;border-right:3px solid var(--accent)"><div class="st-l">Forecast</div><div class="st-v">'+fc(forecastNet)+'</div><div class="st-m">'+forecast.length+' deals ('+D.targets.forecastFrom+'+)</div></div>';
  html+='<div class="st" style="cursor:default"><div class="st-l">Pipeline</div><div class="st-v" style="color:var(--ink3)">'+fc(pipelineNet)+'</div><div class="st-m">'+pipeline.length+' deals ('+D.targets.pipelineFrom+'+)</div></div>';
  html+='<div class="st" style="cursor:default"><div class="st-l">Referral Commissions</div><div class="st-v" style="color:var(--amber)">'+fc(totalRefComm)+'</div><div class="st-m">Owed to partners</div></div>';
  html+='</div>';

  // Section 3: Deal-by-Deal — ALL deals grouped by category
  function renderDealTable(title,deals,titleColor,emptyMsg){
    if(!deals.length) return '<div style="margin-bottom:20px"><div class="sh"><h2 class="stl" style="color:'+titleColor+'">'+title+' (0)<span class="al"></span></h2></div><div class="empty">'+emptyMsg+'</div></div>';
    var totalDV=deals.reduce(function(s,d){return s+d.arr},0);
    var totalGR=deals.reduce(function(s,d){return s+expRev(d)},0);
    var totalRC=deals.reduce(function(s,d){return s+refComm(d)},0);
    var totalNR=deals.reduce(function(s,d){return s+netRev(d)},0);
    var h2='<div style="margin-bottom:20px"><div class="sh"><h2 class="stl" style="color:'+titleColor+'">'+title+' ('+deals.length+')<span class="al"></span></h2><span style="font-size:12px;font-weight:600;color:'+titleColor+'">Net: '+fc(totalNR)+'</span></div>';
    h2+='<div class="tw"><table><thead><tr><th>Company</th><th>Product</th><th>Deal Value</th><th>Type</th><th>Your %</th><th>Your Gross</th><th>Ref % (on deal)</th><th>Ref Comm</th><th>Net to You</th></tr></thead><tbody>';
    deals.sort(function(a,b){return b.arr-a.arr}).forEach(function(d){
      var gr=expRev(d),rc=refComm(d),nr=netRev(d);
      var typeLabel=d.revenueType==='partner_share'?d.partner:'Own Product';
      h2+='<tr onclick="vDeal(\''+d.id+'\')" style="cursor:pointer">';
      h2+='<td><div class="nm">'+d.co+'</div><div style="font-size:10px;color:var(--ink3)">'+bd(d.stage,d.stage===wonStage()?'gn':'bl')+' · '+d.contact+'</div></td>';
      h2+='<td style="font-size:11px;font-weight:500">'+d.product+'</td>';
      h2+='<td style="font-family:monospace;font-size:12px">'+fc(d.arr)+'</td>';
      h2+='<td style="font-size:10px">'+typeLabel+'</td>';
      h2+='<td style="font-size:11px;text-align:center">'+d.revenueSharePct+'%</td>';
      h2+='<td style="font-family:monospace;font-size:12px">'+fc(gr)+'</td>';
      h2+='<td style="font-size:11px;text-align:center;color:'+(d.referralPct?'var(--amber)':'var(--ink3)')+'">'+(d.referralPct?d.referralPct+'%':'—')+(d.referralPartner?'<div style="font-size:8px">'+d.referralPartner+'</div>':'')+'</td>';
      h2+='<td style="font-family:monospace;font-size:12px;color:'+(rc>0?'var(--amber)':'var(--ink3)')+'">'+fc(rc)+'</td>';
      h2+='<td style="font-family:monospace;font-size:12px;font-weight:600;color:'+titleColor+'">'+fc(nr)+'</td>';
      h2+='</tr>';
    });
    h2+='<tr style="background:#faf8f3"><td colspan="2" style="text-align:right;font-weight:600">Totals</td>';
    h2+='<td style="font-family:monospace;font-weight:600">'+fc(totalDV)+'</td><td></td><td></td>';
    h2+='<td style="font-family:monospace;font-weight:600">'+fc(totalGR)+'</td><td></td>';
    h2+='<td style="font-family:monospace;font-weight:600;color:var(--amber)">'+fc(totalRC)+'</td>';
    h2+='<td style="font-family:monospace;font-weight:700;color:'+titleColor+'">'+fc(totalNR)+'</td></tr>';
    h2+='</tbody></table></div></div>';
    return h2;
  }

  html+=renderDealTable('Actual Revenue',earned,'var(--green)','No deals at '+D.targets.actualRevenueFrom+'+ yet');
  html+=renderDealTable('Forecast Revenue',forecast,'var(--accent)','No deals at '+D.targets.forecastFrom+'+ yet');
  html+=renderDealTable('Pipeline Revenue',pipeline,'var(--warm)','No deals at '+D.targets.pipelineFrom+'+ yet');
  if(early.length) html+=renderDealTable('Early Stage (not in forecast)',early,'var(--ink3)','');

  // Section 4: Revenue by Product and Partner
  html+='<div class="g2" style="margin-bottom:20px">';
  var byProd={};all.filter(function(d){return isPipeline(d)||isForecast(d)||isActualRev(d)}).forEach(function(d){if(!byProd[d.product])byProd[d.product]=0;byProd[d.product]+=netRev(d)});
  html+='<div class="cd"><h3>Net Revenue by Product</h3><div class="ds">Pipeline + Forecast + Actual</div>';
  Object.entries(byProd).sort(function(a,b){return b[1]-a[1]}).forEach(function(e){
    html+='<div class="kv"><span class="kv-l">'+e[0]+'</span><span class="kv-v">'+fc(e[1])+'</span></div>';
  });
  html+='</div>';
  var byPart={'Own Product':0};all.filter(function(d){return isPipeline(d)||isForecast(d)||isActualRev(d)}).forEach(function(d){var k=d.isPartnerDeal?d.partner:'Own Product';if(!byPart[k])byPart[k]=0;byPart[k]+=netRev(d)});
  html+='<div class="cd"><h3>Net Revenue by Partner</h3><div class="ds">Your share from each relationship</div>';
  Object.entries(byPart).sort(function(a,b){return b[1]-a[1]}).forEach(function(e){
    html+='<div class="kv"><span class="kv-l">'+e[0]+'</span><span class="kv-v">'+fc(e[1])+'</span></div>';
  });
  html+='</div></div>';

  // Section 5: Quarterly Projection
  html+='<div class="cd"><h3>Quarterly Revenue Projection</h3><div class="ds">Based on expected close dates (forecast + pipeline deals)</div>';
  var months={};forecast.concat(pipeline).forEach(function(d){
    var m=d.nextAction?d.nextAction.slice(0,7):'No date';
    if(!months[m])months[m]=[];months[m].push(d);
  });
  Object.keys(months).sort().forEach(function(m){
    var deals=months[m],total=deals.reduce(function(s,d){return s+netRev(d)},0);
    var label=m==='No date'?'No date set':new Date(m+'-01').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
    html+='<div style="padding:8px 0;border-bottom:1px dashed var(--line)"><div style="display:flex;justify-content:space-between;font-weight:600;font-size:13px"><span>'+label+'</span><span style="color:var(--accent)">'+fc(total)+'</span></div>';
    deals.forEach(function(d){html+='<div style="display:flex;justify-content:space-between;font-size:11px;color:var(--ink2);padding:2px 12px"><span>'+d.co+' ('+d.product+' · '+d.stage+')</span><span>'+fc(netRev(d))+'</span></div>'});
    html+='</div>';
  });
  html+='</div>';

  $('#p-rev').innerHTML=html;
}

// ═══ TARGETS ═══
const TGT_ST=['Watching','Researching','Connecting','Approached','Parked'];
const TGT_WARM=['Cold','Warm','Hot'];

const TGT_PARK_REASONS=['Timing wrong','No connection found','Too small','Already using competitor','Not interested','Other'];
const TGT_SRC=['Observed','Referral','Research','Event','Other'];
const TGT_FIT=['Worth pursuing','Maybe','Long shot'];
const TGT_SECTORS=['Healthcare','Logistics','Real Estate','Retail','Insurance','Automotive','Finance','Government','Education','Recruitment','Fitness','Hospitality','F&B','Legal','Construction','Telecom','Manufacturing','Professional Services','Other'];
let tgtF='All';
let taskTF='all';

function ftgt(id){return D.prospectTargets.find(t=>t.id===id)}

function tgtDaysIn(t){return Math.max(0,dd(t.created||today,today))}
function tgtStale(t){return !t.nextDate || t.nextDate<today}

function rTgt(ph){
  const all=D.prospectTargets||[];
  const filtered=tgtF==='All'?all:all.filter(t=>t.status===tgtF);

  let html=ph;

  // Stats strip
  const counts={};TGT_ST.forEach(s=>counts[s]=all.filter(t=>t.status===s).length);const active=all.filter(t=>t.status!=='Parked');
  const converted=D.deals.filter(d=>d.notes&&d.notes.includes('[from-target]')).length;
  const stale=active.filter(t=>tgtStale(t)).length;
  html+='<div class="sts">';
  TGT_ST.forEach(s=>{
    const cls=s==='Approached'?'g':s==='Connecting'?'':'w';
    html+=`<div class="st ${cls}" onclick="tgtF='${s}';rv('tgt')"><div class="st-l">${s}</div><div class="st-v">${counts[s]}</div><div class="st-m">targets</div></div>`;
  });
  html+='</div>';

  // Filter chips + actions
  html+='<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><div class="fl">';
  ['All',...TGT_ST].forEach(s=>{html+=`<button class="ch${tgtF===s?' on':''}" onclick="tgtF='${s}';rv('tgt')">${s}${s!=='All'?' ('+counts[s]+')':' ('+all.length+')'}</button>`});
  html+='</div><div style="display:flex;gap:8px"><button class="btn gl" onclick="tgtPortfolioAI()">◎ Analyse All</button><button class="btn gh" onclick="tgtQuickAdd()">⚡ Quick Add</button><button class="btn" onclick="tgtAddM()">+ Add Target</button></div></div>';

  // Portfolio AI result
  if(D.tgtAiCache?.text){
    html+='<div class="cd" style="border-left:3px solid var(--gold);margin-bottom:14px"><div style="display:flex;justify-content:space-between;align-items:flex-start"><h3 style="font-size:14px">Portfolio Analysis</h3><div style="display:flex;gap:6px"><button class="btn sm gh" onclick="saveTgtPortfolioInsight()">Archive</button><button class="btn sm gh" onclick="D.tgtAiCache={};save();rv(\'tgt\')">Clear</button></div></div><div style="font-size:12px;color:var(--ink2);margin-top:2px">'+new Date(D.tgtAiCache.date||today).toLocaleDateString('en-GB')+'</div><div id="tgt-portfolio-ai" style="font-size:13px;line-height:1.7;margin-top:10px;white-space:pre-wrap">'+D.tgtAiCache.text+'</div></div>';
  }
  if(D.tgtAiArchive?.length){
    html+='<details style="margin-bottom:14px"><summary style="font-size:11px;color:var(--ink3);cursor:pointer">Previous analyses ('+D.tgtAiArchive.length+')</summary>';
    D.tgtAiArchive.forEach((a,i)=>{html+='<div class="cd" style="margin-top:6px;border-left:2px solid var(--line)"><div style="font-size:10px;color:var(--ink3)">'+new Date(a.date).toLocaleDateString('en-GB')+'</div><div style="font-size:12px;white-space:pre-wrap;margin-top:4px">'+a.text+'</div></div>'});
    html+='</details>';
  }

  // Stale alert
  if(stale>0) html+=`<div style="background:var(--abg);border-left:3px solid var(--amber);padding:10px 14px;border-radius:0 4px 4px 0;margin-bottom:14px;font-size:12px"><strong>${stale} target${stale>1?'s':''} with no next step or overdue.</strong> Targets without activity quietly die.</div>`;

  // Cards
  if(!filtered.length) html+='<div class="empty">No targets yet. Add one to start building your pipeline.</div>';
  filtered.sort((a,b)=>TGT_ST.indexOf(b.status)-TGT_ST.indexOf(a.status)||tgtDaysIn(b)-tgtDaysIn(a));
  filtered.forEach(t=>{
    const warmCls=t.warmth==='Hot'?'gn':t.warmth==='Warm'?'am':'nt';
    const staleFlag=tgtStale(t);
    const fitCls=t.fit==='Worth pursuing'?'gn':t.fit==='Maybe'?'am':'rd';
    html+=`<div class="ac${staleFlag?' am':''}" onclick="vTgt('${t.id}')" style="cursor:pointer">
      <div class="ac-h"><div class="ac-t">${t.co}</div><div>${bd(t.status,t.status==='Approached'?'gn':t.status==='Connecting'?'bl':t.status==='Researching'?'am':'nt')} ${bd(t.warmth,warmCls)}</div></div>
      <div class="ac-m"><span>📍 ${t.location||'—'}</span><span>🏢 ${t.sector}</span><span>📦 ${t.product}</span><span>${bd(t.fit,fitCls)}</span>${staleFlag?'<span style="color:var(--red)">⚠ Needs action</span>':''}</div>
      ${t.angle?'<div class="ac-sg">'+t.angle+'</div>':''}${t.status==='Parked'?'<div style="font-size:11px;margin-top:4px"><span style="color:var(--ink3)">Parked: '+(t.parkReason||'')+'</span> <button class="btn sm gh" onclick="event.stopPropagation();unparkTgt(\''+t.id+'\')" style="font-size:10px;padding:2px 8px">Unpark</button></div>':''}
    </div>`;
  });

  $('#p-tgt').innerHTML=html;
}

    html+='</details>';

  const t=ftgt(id);if(!t)return;
  if(!confirm('Convert "'+t.co+'" to a deal in Pipeline?'))return;
  const deal={id:'D-'+String(D.deals.length+1).padStart(3,'0'),co:t.co,contact:t.routeIn?.name||'',contactTitle:'',contactPhone:'',contactEmail:'',stage:D.stages[0],arr:0,confidence:'low',src:t.source||'Other',product:t.product||D.products[0],isPartnerDeal:false,partner:'',stageEnteredDate:today,notes:'[from-target] '+t.angle+'\n\nResearch: '+(t.researchLog||[]).map(l=>l.date+': '+l.note).join('\n'),created:today,nextAction:'',dealContext:t.useCase||'',competitive:'',winTheme:t.angle||'',stakeholders:[],buyerProcess:[],activities:[{date:today,type:'Note',note:'Converted from Target. Research log and angle carried over.'}],references:[],revenueType:'own_product',revenueSharePct:100,referralPartner:'',referralPct:0};
  D.deals.push(deal);
  // auto-create follow-up task
  D.tasks.push({id:'TK-'+Date.now(),title:'Send discovery questionnaire to '+t.co,deal:deal.id,targetId:'',due:new Date(Date.now()+3*86400000).toISOString().slice(0,10),priority:'high',status:'not_started'});
  // remove target tasks
  D.tasks=D.tasks.filter(x=>x.targetId!==id);
  D.prospectTargets=D.prospectTargets.filter(x=>x.id!==id);
  save();sw('pipe');toast('Converted to deal: '+t.co);
};

// ═══ TARGET AI — PER TARGET ═══
window.callTgtGemini=async function(id){
  const t=ftgt(id);if(!t)return;
  if(!D.aiConfig?.apiKey){toast('Set Gemini API key in Settings');return}
  const el=document.getElementById('tgt-ai-'+id);
  if(el)el.innerHTML='<div style="font-size:12px;color:var(--ink2);animation:pulse 1.5s infinite">Researching '+t.co+'...</div>';
  const pp=D.productProfiles?.[t.product];
  const prompt=`You are a Saudi Arabia B2B presales advisor. I am researching a company I have not contacted yet. Help me plan my approach.

COMPANY: ${t.co} — ${t.sector}, ${t.location||'unknown location'}, ${t.size||'unknown size'}
STATUS: ${t.status} for ${tgtDaysIn(t)} days
WARMTH: ${t.warmth}
SOURCE: ${t.source||'unknown'}
MY ANGLE: ${t.angle||'none yet'}
USE CASE: ${t.useCase||'not defined'}
RESEARCH SO FAR: ${(t.researchLog||[]).map(l=>l.date+': '+l.note).join(' | ')||'none'}
ROUTE IN: ${t.routeIn?.name?t.routeIn.name+' ('+t.routeIn.relationship+') — asked: '+(t.routeIn.asked?'yes, result: '+t.routeIn.result:'no'):'No connection mapped'}
PRODUCT: ${t.product} — ${pp?.tagline||''}
PRODUCT DIFFERENTIATORS: ${(pp?.differentiators||[]).join(', ')}
COMMON OBJECTIONS: ${(pp?.commonObjections||[]).join(' | ')}
SAUDI CONTEXT: ${pp?.saudiContext||''}

INSTRUCTIONS:
1. Search for recent news about ${t.co} in Saudi Arabia — expansions, hires, complaints, contracts, regulatory changes.
2. Based on their sector and size, what is their likely current setup for customer service? What are their probable pain points?
3. Recommend the best approach angle — what to lead with, what to avoid, and how to open the first conversation.
4. Suggest a specific opening message or talking point for the first contact.
5. Who should I look for as the decision maker? What titles are typical in ${t.sector} companies of this size in Saudi Arabia?
6. What is the one thing I should do this week to move this forward?

RESPONSE FORMAT REQUIREMENTS:
- For each recommendation, give: WHAT to do, EXACTLY HOW with example text or script the user can copy, WHEN with a specific day or timeframe, and WHY this works in Saudi Arabia.
- Instead of "consider reaching out via WhatsApp," say "Send a WhatsApp message on Sunday morning saying: [exact suggested text]."
- Instead of "identify the decision maker," say "Look for the Operations Manager or Clinic Director — in a 3-branch clinic in Riyadh, this is usually the owner or a family member named on the CR."
- Be specific to Saudi business culture: first meetings over coffee, WhatsApp as primary channel, family involvement in SME decisions, government procurement formality.
- Give real examples from the Saudi market where possible.`;

  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${D.aiConfig.model}:generateContent?key=${D.aiConfig.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],tools:[{google_search:{}}]})});
    const j=await r.json();
    const text=j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('\n')||'No response';
    t.aiCache={text,date:today};save();
    if(el)el.innerHTML=`<div style="font-size:12px;color:var(--ink2);margin-bottom:4px">${new Date().toLocaleDateString('en-GB')}</div><div style="font-size:13px;line-height:1.7;">${renderMD(text)}</div><div style="margin-top:8px;display:flex;gap:6px"><button class="btn sm gh" onclick="saveTgtInsight('${id}')">Archive</button><button class="btn sm gh" onclick="ftgt('${id}').aiCache={};save();vTgt('${id}')">Clear</button></div>`;
  }catch(e){if(el)el.innerHTML='<div style="color:var(--red);font-size:12px">Error: '+e.message+'</div>'}
};

window.saveTgtInsight=function(id){
  const t=ftgt(id);if(!t||!t.aiCache?.text)return;
  if(!t.aiArchive)t.aiArchive=[];
  t.aiArchive.unshift({text:t.aiCache.text,date:t.aiCache.date||today});
  t.aiCache={};save();vTgt(id);toast('Archived');
};

// ═══ TARGET AI — PORTFOLIO ANALYSIS ═══
window.tgtPortfolioAI=async function(){
  if(!D.aiConfig?.apiKey){toast('Set Gemini API key in Settings');return}
  const all=D.prospectTargets||[];
  if(!all.length){toast('No targets to analyse');return}

  const counts={};TGT_ST.forEach(s=>counts[s]=all.filter(t=>t.status===s).length);const active=all.filter(t=>t.status!=='Parked');
  const stale=active.filter(t=>tgtStale(t)).length;
  const sectors={};all.forEach(t=>{sectors[t.sector]=(sectors[t.sector]||0)+1});
  const warmth={};TGT_WARM.forEach(w=>{warmth[w]=all.filter(t=>t.warmth===w).length});

  const summary=all.map(t=>`${t.co} (${t.sector}, ${t.location||'?'}) — Status: ${t.status}, Warmth: ${t.warmth}, Fit: ${t.fit}, Product: ${t.product}, Angle: ${t.angle||'none'}, Days: ${tgtDaysIn(t)}, Next: ${t.nextStep||'NONE'}, Research: ${(t.researchLog||[]).length} notes`).join('\n');

  const prompt=`You are a Saudi Arabia B2B sales strategy advisor. Analyse my prospecting targets as a portfolio and tell me what needs to change.

PORTFOLIO SUMMARY:
Total targets: ${all.length}
Status breakdown: ${JSON.stringify(counts)}
Stale (no next step or overdue): ${stale}
Sectors: ${JSON.stringify(sectors)}
Warmth: ${JSON.stringify(warmth)}
Sources: ${JSON.stringify(Object.entries(all.reduce((a,t)=>{a[t.source||'unknown']=(a[t.source||'unknown']||0)+1;return a},{})))}
Converted to deals so far: ${D.deals.filter(d=>d.notes&&d.notes.includes('[from-target]')).length}

INDIVIDUAL TARGETS:
${summary}

INSTRUCTIONS:
1. Where is the conversion bottleneck? Which status transition is failing — Watching→Researching, Researching→Connecting, Connecting→Approached, or Approached→Deal?
2. Am I targeting the right mix of sectors and sizes? Is there too much concentration?
3. How many targets are cold vs warm vs hot? What does that say about my outreach strategy?
4. Which 3 targets should I prioritise THIS WEEK and why? Be specific.
5. What pattern explains why targets are stuck? Is it a connection problem, a research problem, or an execution problem?
6. What is the single most impactful action I can take to move more targets into deals?

RESPONSE FORMAT REQUIREMENTS:
- For each target you mention, give: WHAT to do, EXACTLY HOW with example text or script the user can copy, WHEN with a specific day or timeframe, and WHY this works in Saudi Arabia.
- Instead of "consider reaching out via WhatsApp," say "Send a WhatsApp message on Sunday morning saying: [exact suggested text]."
- Instead of "identify the decision maker," say "Look for the Operations Manager or Clinic Director — in a 3-branch clinic in Riyadh, this is usually the owner or a family member named on the CR."
- Be specific to Saudi business culture: first meetings over coffee, WhatsApp as primary channel, family involvement in SME decisions, government procurement formality.
- Give real examples from the Saudi market where possible.`;

  // Show loading
  D.tgtAiCache={text:'Analysing '+all.length+' targets...',date:today};rv('tgt');

  try{
    const r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${D.aiConfig.model}:generateContent?key=${D.aiConfig.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],tools:[{google_search:{}}]})});
    const j=await r.json();
    const text=j.candidates?.[0]?.content?.parts?.map(p=>p.text||'').join('\n')||'No response';
    D.tgtAiCache={text,date:today};save();rv('tgt');
  }catch(e){D.tgtAiCache={text:'Error: '+e.message,date:today};rv('tgt')}
};

window.saveTgtPortfolioInsight=function(){
  if(!D.tgtAiCache?.text)return;
  if(!D.tgtAiArchive)D.tgtAiArchive=[];
  D.tgtAiArchive.unshift({text:D.tgtAiCache.text,date:D.tgtAiCache.date||today});
  D.tgtAiCache={};save();rv('tgt');toast('Archived');
};

window.tgtQuickAdd=function(){
  opM('Quick Add Targets',`
    <p style="font-size:12px;color:var(--ink2);margin-bottom:10px">Add multiple targets fast. One per line: <strong>Company Name, Sector, Location</strong></p>

  `,`<button class="btn gh" onclick="clM()">Cancel</button><button class="btn" onclick="saveQuickTgts()">Add All</button>`);

window.saveQuickTgts=function(){
  const lines=$('#tq-list').value.split('\n').map(l=>l.trim()).filter(Boolean);
  const prod=$('#tq-pr').value,src=$('#tq-src').value;
  let added=0;
  lines.forEach(line=>{
    const parts=line.split(',').map(s=>s.trim());
    const co=parts[0];if(!co)return;
    // duplicate check
    if(D.prospectTargets.some(t=>t.co.toLowerCase()===co.toLowerCase())||D.deals.some(d=>d.co.toLowerCase()===co.toLowerCase())){return}
    D.prospectTargets.push({id:'TG-'+Date.now()+'-'+added,co,sector:parts[1]||'Other',location:parts[2]||'',size:'',source:src,status:'Watching',warmth:'Cold',product:prod,useCase:'',angle:'',fit:'Maybe',nextStep:'',nextDate:'',researchLog:[],routeIn:{name:'',relationship:'',asked:false,result:''},created:today,aiCache:{},aiArchive:[]});
    added++;
  });
  save();clM();rv('tgt');toast(added+' target'+(added!==1?'s':'')+' added');
};


window.saveLostDealInsight=function(i){
  const ld=D.lostDeals[i];if(!ld||!ld.aiCache?.text)return;
  if(!ld.aiArchive)ld.aiArchive=[];
  ld.aiArchive.unshift({text:ld.aiCache.text,date:ld.aiCache.date||today});
  ld.aiCache={};save();rv('lost');toast('Archived against deal');
};


function renderMD(text){
  return text
    .replace(/### (.*)/g,'<h3 style="font-size:15px;margin:14px 0 6px;color:var(--ink)">$1</h3>')
    .replace(/## (.*)/g,'<h2 style="font-size:16px;margin:16px 0 8px;color:var(--ink)">$1</h2>')
    .replace(/# (.*)/g,'<h2 style="font-size:17px;margin:18px 0 8px;color:var(--ink)">$1</h2>')
    .replace(/#### (.*)/g,'<h4 style="font-size:14px;margin:12px 0 4px;color:var(--ink)">$1</h4>')
    .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
    .replace(/\*(.+?)\*/g,'<em>$1</em>')
    .replace(/^- (.*)/gm,'<div style="padding-left:14px;margin:2px 0">• $1</div>')
    .replace(/^\d+\. (.*)/gm,'<div style="padding-left:14px;margin:2px 0">$&</div>')
    .replace(/\n/g,'<br>');
}
