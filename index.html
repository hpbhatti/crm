<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RevOps Command v7.1 — SaaS CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f5f3ee;--card:#fff;--ink:#1a1f2e;--ink2:#5a6478;--ink3:#8a92a3;--line:#e4e0d6;--lineS:#c8c2b0;--accent:#1a3a52;--warm:#b8884a;--gold:#c9a96e;--green:#4a7c59;--amber:#c47e2a;--red:#b04540;--gbg:#e8f0e8;--abg:#faf0e0;--rbg:#f5e0de;--bbg:#e1ebf2;--sh:0 1px 2px rgba(26,31,46,.04),0 4px 12px rgba(26,31,46,.06);--shL:0 8px 28px rgba(26,31,46,.12)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{font-family:'IBM Plex Sans',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;min-height:100vh}
body{background-image:radial-gradient(circle at 20% 10%,rgba(184,136,74,.04) 0%,transparent 40%),radial-gradient(circle at 80% 80%,rgba(26,58,82,.03) 0%,transparent 40%)}
h1,h2,h3,h4{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.01em}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
/* Sidebar */
.sb{background:var(--accent);color:#f5f3ee;padding:28px 20px;position:sticky;top:0;height:100vh;overflow-y:auto;display:flex;flex-direction:column}
.brand{padding-bottom:24px;margin-bottom:24px;border-bottom:1px solid rgba(255,255,255,.1)}
.brand-m{width:42px;height:42px;border:1.5px solid var(--gold);display:grid;place-items:center;margin-bottom:12px;color:var(--gold);font-family:'Fraunces',serif;font-size:20px}
.brand h2{font-size:17px;font-weight:600;line-height:1.3}.brand .sub{font-size:11px;color:rgba(245,243,238,.5);margin-top:3px;letter-spacing:.04em}
.ns{font-size:10px;color:rgba(245,243,238,.35);letter-spacing:.12em;margin:20px 14px 6px;font-weight:600;text-transform:uppercase}
.ni{background:none;border:none;color:rgba(245,243,238,.65);text-align:start;padding:10px 14px;border-radius:6px;font-family:inherit;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:11px;transition:all .15s;width:100%}
.ni:hover{background:rgba(245,243,238,.06);color:#f5f3ee}.ni.on{background:rgba(201,169,110,.14);color:var(--gold);font-weight:500}
.ni .ico{width:20px;text-align:center;font-size:15px;opacity:.8}.ni .ct{margin-left:auto;background:rgba(245,243,238,.1);color:rgba(245,243,238,.6);font-size:10px;font-weight:600;padding:2px 7px;border-radius:10px}
.sf{margin-top:auto;padding-top:16px}.sf .sa{display:flex;flex-direction:column;gap:5px}
.sbb{background:rgba(245,243,238,.06);border:1px solid rgba(245,243,238,.1);color:rgba(245,243,238,.7);padding:7px 12px;border-radius:5px;font-family:inherit;font-size:11px;cursor:pointer;text-align:start;transition:all .15s}
.sbb:hover{background:rgba(245,243,238,.1);color:#f5f3ee}.sbb.dg:hover{background:rgba(176,69,64,.2);color:#f5d0ce}
/* Main */
.mn{padding:32px 40px;max-width:1300px}
.ph{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:28px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.pt{font-size:24px;font-weight:700}.ps{font-size:12px;color:var(--ink2);margin-top:3px}
.pd{text-align:end;font-size:11px;color:var(--ink3)}.pd strong{color:var(--accent);display:block;font-size:14px;margin-top:2px;font-family:'Fraunces',serif}
/* Stats */
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:28px}
.st{background:var(--card);border:1px solid var(--line);padding:18px 20px;border-radius:6px;position:relative;overflow:hidden;cursor:pointer;transition:all .15s}
.st:hover{box-shadow:var(--shL);transform:translateY(-2px)}.st::before{content:'';position:absolute;top:0;right:0;width:3px;height:100%;background:var(--accent)}
.st.w::before{background:var(--amber)}.st.d::before{background:var(--red)}.st.g::before{background:var(--green)}
.st-l{font-size:11px;color:var(--ink2);letter-spacing:.04em}.st-v{font-size:28px;font-weight:700;font-family:'Fraunces',serif;margin-top:4px;color:var(--accent)}
.st.w .st-v{color:var(--amber)}.st.d .st-v{color:var(--red)}.st.g .st-v{color:var(--green)}
.st-m{font-size:11px;color:var(--ink3);margin-top:6px}.st-dr{position:absolute;bottom:10px;right:14px;font-size:10px;color:var(--accent);opacity:0;transition:opacity .15s}.st:hover .st-dr{opacity:.9}
.tg{display:inline-block;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:3px;margin-bottom:4px}
.tg.ld{background:#e6ecf2;color:var(--accent)}.tg.lg{background:#f5ebd4;color:var(--warm)}
/* Cards */
.cd{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:20px 22px;margin-bottom:14px}
.cd h3{font-size:15px;margin-bottom:3px}.cd .ds{font-size:12px;color:var(--ink2);margin-bottom:14px}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.stl{font-size:16px;font-weight:600}.al{display:inline-block;width:20px;height:2px;background:var(--gold);vertical-align:middle;margin-left:8px}
/* Table */
.tw{background:var(--card);border:1px solid var(--line);border-radius:6px;overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{background:#faf8f3;text-align:left;padding:11px 14px;font-weight:500;color:var(--ink2);font-size:11px;letter-spacing:.04em;border-bottom:1px solid var(--line)}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:none}tr:hover td{background:#faf8f3}
td .nm{font-weight:500}.td .sb2{font-size:11px;color:var(--ink3)}
/* Badges */
.bd{display:inline-block;padding:3px 10px;border-radius:11px;font-size:11px;font-weight:500;border:1px solid}
.bd.gn{background:var(--gbg);color:var(--green);border-color:rgba(74,124,89,.3)}.bd.am{background:var(--abg);color:var(--amber);border-color:rgba(196,126,42,.3)}
.bd.rd{background:var(--rbg);color:var(--red);border-color:rgba(176,69,64,.3)}.bd.nt{background:#eee9dd;color:var(--ink2);border-color:var(--line)}
.bd.bl{background:var(--bbg);color:#2c5e7d;border-color:rgba(44,94,125,.25)}
/* Buttons */
.btn{background:var(--accent);color:#f5f3ee;border:none;padding:8px 16px;border-radius:5px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:all .15s}
.btn:hover{background:#243d52;transform:translateY(-1px)}.btn.gh{background:transparent;color:var(--ink);border:1px solid var(--lineS)}.btn.gh:hover{background:var(--card);border-color:var(--accent);color:var(--accent)}
.btn.gl{background:var(--gold);color:var(--accent)}.btn.gl:hover{background:var(--warm);color:#fff}
.btn.dg{background:transparent;color:var(--red);border:1px solid rgba(176,69,64,.3)}.btn.sm{padding:5px 11px;font-size:11px}
.rb{background:none;border:1px solid var(--line);padding:5px 10px;border-radius:4px;font-family:inherit;font-size:11px;cursor:pointer;color:var(--ink2);transition:all .15s}
.rb:hover{border-color:var(--accent);color:var(--accent);background:#faf8f3}
/* Chips */
.fl{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.ch{padding:5px 13px;border-radius:14px;border:1px solid var(--lineS);background:var(--card);font-family:inherit;font-size:11px;cursor:pointer;color:var(--ink2);transition:all .15s}
.ch:hover{border-color:var(--accent);color:var(--accent)}.ch.on{background:var(--accent);color:#f5f3ee;border-color:var(--accent)}
/* Action cards */
.ac{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:8px;border-right:3px solid var(--ink3);transition:all .15s}
.ac.am{border-right-color:var(--amber)}.ac.rd{border-right-color:var(--red)}.ac.gn{border-right-color:var(--green)}.ac:hover{box-shadow:var(--sh)}
.ac-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.ac-t{font-weight:600;font-size:13px}
.ac-m{display:flex;gap:12px;font-size:11px;color:var(--ink2);margin-top:4px;flex-wrap:wrap}
.ac-sg{font-size:11px;color:var(--ink2);margin-top:8px;padding:8px 12px;background:#faf8f3;border-radius:4px;border-left:2px solid var(--gold);line-height:1.5}
/* Modal */
.mo-bg{position:fixed;inset:0;background:rgba(26,31,46,.5);display:none;align-items:center;justify-content:center;z-index:100;backdrop-filter:blur(3px)}.mo-bg.on{display:flex}
.mo{background:var(--card);border-radius:8px;width:100%;max-width:580px;max-height:90vh;overflow-y:auto;box-shadow:var(--shL);border:1px solid var(--line)}
.mo-h{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.mo-t{font-size:16px;font-weight:600;font-family:'Fraunces',serif}.mo-x{background:none;border:none;font-size:20px;cursor:pointer;color:var(--ink3);width:28px;height:28px;border-radius:4px}.mo-x:hover{background:var(--line)}
.mo-b{padding:22px}.mo-f{padding:14px 22px;border-top:1px solid var(--line);display:flex;gap:8px;background:#faf8f3}
.fr{margin-bottom:14px}.fr label{display:block;font-size:11px;font-weight:500;color:var(--ink2);margin-bottom:4px;letter-spacing:.02em}
.fr input,.fr select,.fr textarea{width:100%;padding:8px 11px;border:1px solid var(--lineS);border-radius:5px;font-family:inherit;font-size:13px;color:var(--ink);background:#fafaf7;transition:all .15s}
.fr input:focus,.fr select:focus,.fr textarea:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(26,58,82,.08)}
.fr textarea{min-height:60px;resize:vertical}.fr.r2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.fr.r3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
/* Charts */
.cb{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px}.cb h3{font-size:14px;font-weight:600;margin-bottom:2px;font-family:'Fraunces',serif}
.cb .ds{font-size:11px;color:var(--ink2);margin-bottom:12px}.cb svg{display:block;width:100%;height:auto}
/* Tracking */
.ti{display:flex;gap:10px;align-items:flex-start;padding:8px 12px;background:#faf8f3;border-left:3px solid var(--warm);border-radius:4px;margin-bottom:5px}
.ti-t{font-size:12px;line-height:1.5;flex:1}.ti-d{font-size:10px;color:var(--ink3);margin-top:2px}
/* KV */
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:12px}.kv:last-child{border:none}.kv-l{color:var(--ink2)}.kv-v{font-weight:500}
/* Stakeholder */
.sk{display:flex;gap:10px;align-items:center;padding:10px 12px;background:#faf8f3;border-radius:5px;margin-bottom:5px;border:1px solid var(--line)}
.sk-init{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.sk-init.sup{background:var(--gbg);color:var(--green)}.sk-init.neu{background:var(--abg);color:var(--amber)}.sk-init.blk{background:var(--rbg);color:var(--red)}
.sk-n{font-weight:500;font-size:12px}.sk-r{font-size:10px;color:var(--ink3)}.sk-ct{font-size:10px;color:var(--ink2);margin-top:1px}
/* Buyer process */
.bp-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:12px}
.bp-item:last-child{border:none}
.bp-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}.bp-dot.done{background:var(--green)}.bp-dot.pending{background:var(--amber)}.bp-dot.unknown{background:var(--line)}
/* Confidence badge */
.conf{font-size:10px;font-weight:600;padding:2px 6px;border-radius:3px}
.conf.hi{background:var(--gbg);color:var(--green)}.conf.md{background:var(--abg);color:var(--amber)}.conf.lo{background:var(--rbg);color:var(--red)}
/* Grids */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.g23{display:grid;grid-template-columns:2fr 3fr;gap:14px}.g32{display:grid;grid-template-columns:3fr 2fr;gap:14px}
.gd{display:grid;grid-template-columns:360px 1fr;gap:20px}
.pnl{display:none}.pnl.on{display:block}
.sj{display:flex;gap:4px;margin-bottom:20px;padding:12px 0}.sj-s{flex:1;text-align:center}.sj-bar{height:10px;border-radius:5px;margin-bottom:6px;transition:background .2s}.sj-lab{font-size:10px;font-weight:500;color:var(--ink2)}.sj-days{font-size:12px;font-weight:700;color:var(--accent);margin-top:2px}
.empty{padding:40px;text-align:center;color:var(--ink3);font-size:13px}
.toast{position:fixed;bottom:24px;left:24px;background:var(--accent);color:#f5f3ee;padding:11px 18px;border-radius:6px;font-size:12px;box-shadow:var(--shL);transform:translateY(120%);transition:transform .3s;z-index:200}.toast.show{transform:translateY(0)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
/* Pipeline quick actions */
.pqa{position:relative;display:inline-block}.pqa-btn{background:none;border:1px solid var(--line);border-radius:4px;padding:2px 8px;cursor:pointer;font-size:14px;color:var(--ink2);transition:all .15s}.pqa-btn:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.pqa-menu{display:none;position:absolute;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.1);z-index:100;min-width:180px;overflow:hidden}
.pqa-menu.on{display:block}.pqa-item{display:block;width:100%;padding:8px 14px;border:none;background:none;text-align:left;font-size:11px;cursor:pointer;color:var(--ink);transition:background .1s}.pqa-item:hover{background:#faf8f3}
.pqa-item+.pqa-item{border-top:1px solid var(--line)}.pqa-sep{border-top:1px solid var(--line);margin:0}
/* Tab indicators */
.dtab-ind{display:inline-block;font-size:9px;margin-left:4px;font-weight:700;vertical-align:middle;padding:1px 5px;border-radius:8px}
/* Deal detail tabs */
.dtabs{display:flex;gap:0;border-bottom:2px solid var(--line);margin-bottom:14px}
.dtab{padding:10px 18px;font-size:12px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
.dtab:hover{color:var(--ink)}.dtab.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.dtab-pnl{display:none}.dtab-pnl.on{display:block}
/* Strategy sub-tabs */
.stabs{display:flex;gap:0;margin-bottom:14px;border-bottom:1px solid var(--line)}
.stab{padding:8px 16px;font-size:11px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--ink3);border-bottom:2px solid transparent;margin-bottom:-1px;transition:all .15s;text-transform:uppercase;letter-spacing:.03em}
.stab:hover{color:var(--ink)}.stab.on{color:var(--warm);border-bottom-color:var(--warm)}
.stab-pnl{display:none}.stab-pnl.on{display:block}
/* Product profile cards */
.pp{background:#faf8f3;border:1px solid var(--line);border-radius:6px;padding:14px 16px;margin-bottom:8px;border-left:3px solid var(--accent)}
.pp h4{font-size:13px;margin-bottom:6px}.pp-g{display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:11px}
.pp-f{color:var(--ink2)}.pp-v{color:var(--ink)}
.pp-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}.pp-tag{font-size:9px;padding:2px 7px;border-radius:10px;background:var(--bbg);color:#2c5e7d;border:1px solid rgba(44,94,125,.2)}
/* References */
.ref{display:flex;align-items:center;gap:10px;padding:8px 12px;background:#faf8f3;border:1px solid var(--line);border-radius:5px;margin-bottom:4px;font-size:12px;transition:all .15s}
.ref:hover{border-color:var(--accent);background:#fff}.ref-ico{font-size:16px;flex-shrink:0}
.ref-info{flex:1;min-width:0}.ref-name{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref-meta{font-size:10px;color:var(--ink3);display:flex;gap:8px;margin-top:1px}
.ref a{color:var(--accent);text-decoration:none}.ref a:hover{text-decoration:underline}
/* Analysis */
.an-card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:18px 20px;margin-bottom:14px}
.an-card h3{font-size:15px;margin-bottom:4px;font-family:'Fraunces',serif}.an-card .ds{font-size:12px;color:var(--ink2);margin-bottom:14px}
.an-metric{text-align:center;padding:14px}.an-metric .v{font-size:22px;font-weight:700;font-family:'Fraunces',serif}.an-metric .l{font-size:10px;color:var(--ink2);margin-top:2px;letter-spacing:.03em}
.funnel-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px}
.funnel-row:last-child{border:none}
.funnel-bar-bg{flex:1;height:18px;background:var(--line);border-radius:3px;overflow:hidden;position:relative}
.funnel-bar{height:100%;border-radius:3px;transition:width .3s}
.funnel-pct{font-size:10px;font-weight:600;width:42px;text-align:right}
/* Account brief */
.ab-score{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:14px}
.ab-score>div{cursor:help;text-align:center;padding:12px 8px;background:#faf8f3;border:1px solid var(--line);border-radius:6px}
.ab-score .v{font-size:20px;font-weight:700;font-family:'Fraunces',serif}.ab-score .l{font-size:9px;color:var(--ink2);margin-top:2px}
@media(max-width:980px){.app{grid-template-columns:1fr}.sb{position:static;height:auto}.mn{padding:24px 20px}.sts,.g2,.g3,.g23,.g32,.gd,.ab-score{grid-template-columns:1fr}}
/* War Room */
.wr-target{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px 24px;margin-bottom:18px}
.wr-target-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.wr-target-head h3{font-size:18px}.wr-target-head .gap{font-size:14px;font-weight:600}
/* Bottleneck Map */
.bn-map{display:flex;gap:2px;margin-bottom:18px;min-height:160px}
.bn-col{flex:1;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:8px 6px;display:flex;flex-direction:column;gap:4px;min-width:0}
.bn-col-head{font-size:9px;font-weight:600;color:var(--ink3);text-align:center;padding-bottom:4px;border-bottom:1px solid var(--line);margin-bottom:2px;letter-spacing:.04em;text-transform:uppercase}
.bn-col-count{font-size:8px;color:var(--ink3);text-align:center}
.bn-deal{border-radius:4px;padding:6px 7px;border-left:3px solid var(--accent);cursor:pointer;transition:all .12s;overflow:hidden}
.bn-deal:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.bn-deal.stuck{border-left-color:var(--red);background:var(--rbg)}.bn-deal.slow{border-left-color:var(--amber);background:var(--abg)}.bn-deal.ok{border-left-color:var(--green);background:var(--gbg)}
.bn-deal .bn-co{font-size:10px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bn-deal .bn-rev{font-size:9px;color:var(--ink2);margin-top:1px}
.bn-deal .bn-days{font-size:8px;font-weight:600;margin-top:1px}
.wr-thermo{height:28px;background:var(--line);border-radius:14px;overflow:hidden;position:relative;margin-bottom:8px}
.wr-thermo-fill{height:100%;border-radius:14px;display:flex;align-items:center}
.wr-thermo-seg{height:100%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:600;color:#fff;overflow:hidden;white-space:nowrap;padding:0 8px}
.wr-thermo-label{display:flex;justify-content:space-between;font-size:10px;color:var(--ink3)}
.wr-legend{display:flex;gap:16px;margin-top:10px;font-size:11px;color:var(--ink2);flex-wrap:wrap}
.wr-legend span{display:flex;align-items:center;gap:5px}.wr-legend .dot{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.wr-problem{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:12px;border-left:4px solid var(--ink3);cursor:pointer;transition:all .15s}
.wr-problem:hover{box-shadow:var(--sh);transform:translateY(-1px)}
.wr-problem.critical{border-left-color:var(--red)}.wr-problem.warning{border-left-color:var(--amber)}.wr-problem.info{border-left-color:var(--accent)}

// ═══ SUPABASE DATA LAYER ═══
// Converts between the nested D object (used by all existing rendering code)
// and the flat Supabase tables. All existing views continue to work unchanged.

async function sbLoad(){
  try{
    // Load settings — use limit(1) + maybeSingle to avoid errors
    let {data:settings,error:se}=await sb.from('settings').select('*').limit(1).maybeSingle();
    if(se){console.error('Settings error:',se.message);throw se}
    if(!settings){
      // No settings row yet — insert default
      const {data:ns}=await sb.from('settings').insert({}).select().single();
      settings=ns;
    }

    // Load partners
    const {data:productPartners}=await sb.from('product_partners').select('*').eq('is_active',true);
    const {data:referralPartners}=await sb.from('referral_partners').select('*').eq('is_active',true);

    // Load product profiles
    const {data:profiles}=await sb.from('product_profiles').select('*');

    // Load deals with related data
    const {data:deals}=await sb.from('deals').select('*');
    const {data:stakeholders}=await sb.from('stakeholders').select('*');
    const {data:activities}=await sb.from('activities').select('*').order('activity_date',{ascending:false});
    const {data:buyerSteps}=await sb.from('buyer_process_steps').select('*').order('sort_order');
    const {data:references}=await sb.from('deal_references').select('*');
    const {data:insights}=await sb.from('saved_insights').select('*');
    const {data:objections}=await sb.from('objections').select('*');
    const {data:exitChecks}=await sb.from('deal_exit_checks').select('*');

    // Load tasks
    const {data:tasks}=await sb.from('tasks').select('*');
    const {data:extensions}=await sb.from('task_extensions').select('*');

    // Load other tables
    const {data:lostDeals}=await sb.from('lost_deals').select('*');
    const {data:targets}=await sb.from('prospect_targets').select('*');
    const {data:targetLogs}=await sb.from('target_research_logs').select('*');
    const {data:aiCache}=await sb.from('ai_cache').select('*');
    const {data:warArchive}=await sb.from('war_archive').select('*');
    const {data:targetAiArchive}=await sb.from('target_ai_archive').select('*');
    const {data:reportComments}=await sb.from('report_comments').select('*');
    const {data:weeklyMetrics}=await sb.from('weekly_metrics').select('*');
    const {data:exitCriteria}=await sb.from('stage_exit_criteria').select('*').eq('is_active',true).order('sort_order');
    const {data:reviewNotes}=await sb.from('review_notes').select('*').order('review_date',{ascending:false});
    const {data:principles}=await sb.from('sales_principles').select('*').eq('is_active',true);

    // ── Assemble the D object ──
    // This matches the exact structure all existing rendering functions expect

    // Partner margins map
    const partnerMargins={};
    (productPartners||[]).forEach(p=>{partnerMargins[p.name]=p.default_margin_pct});

    // Referral partners map (now fixed fee)
    const refPartners={};
    (referralPartners||[]).forEach(p=>{refPartners[p.name]=p.fixed_fee_sar});

    // Product profiles map
    const ppMap={};
    (profiles||[]).forEach(p=>{
      ppMap[p.product_name]={
        tagline:p.tagline||'',icp:p.icp||'',
        target_sectors:p.target_sectors||[],budget_range:p.budget_range||'',
        size_range:p.size_range||'',pain_indicators:p.pain_indicators||[],
        disqualifiers:p.disqualifiers||[],
        differentiators:p.differentiators||[],
        commonObjections:p.common_objections||[],
        competitors:p.competitors||[],
        saudiContext:p.saudi_context||''
      };
    });

    // Assemble deals with nested data
    const assembledDeals=(deals||[]).map(d=>{
      const dStk=(stakeholders||[]).filter(s=>s.deal_id===d.id).map(s=>({
        _id:s.id,name:s.name,title:s.title||'',phone:s.phone||'',email:s.email||'',
        role:s.role||'Influencer',influence:s.influence||'medium',
        disposition:s.disposition||'Neutral',reportsTo:s.reports_to||''
      }));
      const dAct=(activities||[]).filter(a=>a.deal_id===d.id).map(a=>({
        _id:a.id,date:a.activity_date,type:a.activity_type,note:a.note||''
      }));
      const dBP=(buyerSteps||[]).filter(b=>b.deal_id===d.id).map(b=>({
        _id:b.id,step:b.step_text,status:b.status||'unknown'
      }));
      const dRef=(references||[]).filter(r=>r.deal_id===d.id).map(r=>({
        _id:r.id,label:r.title,url:r.url||'',type:r.ref_type||'Document',date:r.added_date
      }));
      const dIns=(insights||[]).filter(i=>i.deal_id===d.id).map(i=>({
        _id:i.id,text:i.insight_text,date:i.insight_date
      }));
      const dObj=(objections||[]).filter(o=>o.deal_id===d.id).map(o=>({
        _id:o.id,text:o.objection_text,responseStrategy:o.response_strategy||'',
        status:o.status||'open',resolvedDate:o.resolved_date
      }));
      const dExitChecks=(exitChecks||[]).filter(e=>e.deal_id===d.id).map(e=>({
        _id:e.id,criterionId:e.criterion_id,stageName:e.stage_name,
        isMet:e.is_met,metDate:e.met_date
      }));

      // Find partner names from IDs
      const pp=(productPartners||[]).find(p=>p.id===d.product_partner_id);
      const rp=(referralPartners||[]).find(p=>p.id===d.referral_partner_id);

      return {
        id:d.id,co:d.company,contact:d.contact_name||'',contactTitle:d.contact_title||'',
        contactPhone:d.contact_phone||'',contactEmail:d.contact_email||'',
        stage:d.stage,stageEnteredDate:d.stage_entered_date,confidence:d.confidence||'medium',
        arr:d.deal_value||0,
        revenueType:d.revenue_type||'own_product',
        partnerBasePrice:d.partner_base_price||0,
        marginPct:d.margin_pct||20,
        yourMargin:d.your_margin||0,
        isPartnerDeal:d.is_partner_deal||false,
        partner:pp?pp.name:'',partnerId:d.product_partner_id,
        referralPartner:rp?rp.name:'',referralPartnerId:d.referral_partner_id,
        referralFee:d.referral_fee||0,
        product:d.product||'',src:d.source||'Inbound',
        dealContext:d.deal_context||'',competitive:d.competitive||'',
        winTheme:d.win_theme||'',notes:d.notes||'',
        icpMatch:d.icp_match||'unknown',
        nextAction:d.next_action||'',created:d.created||'',
        stakeholders:dStk,activities:dAct,buyerProcess:dBP,
        references:dRef,savedInsights:dIns,
        objections:dObj,exitChecks:dExitChecks
      };
    });

    // Assemble tasks with extensions
    const assembledTasks=(tasks||[]).map(t=>{
      const tExt=(extensions||[]).filter(e=>e.task_id===t.id).map(e=>({
        _id:e.id,oldDate:e.old_date,newDate:e.new_date,reason:e.reason,note:e.note||'',date:e.extended_at
      }));
      return {
        id:t.id,title:t.title,deal:t.deal_id||'',due:t.due_date,
        priority:t.priority||'medium',status:t.status||'not_started',
        extensions:tExt
      };
    });

    // Assemble targets
    const assembledTargets=(targets||[]).map(t=>{
      const tLogs=(targetLogs||[]).filter(l=>l.target_id===t.id).map(l=>({
        _id:l.id,date:l.log_date,note:l.note
      }));
      const tAiArch=(targetAiArchive||[]).filter(a=>a.target_id===t.id).map(a=>({
        _id:a.id,text:a.analysis_text,date:a.analysis_date
      }));
      return {
        id:t.id,co:t.company,sector:t.sector||'',location:t.location||'',
        size:t.company_size||'',website:t.website||'',source:t.source||'',
        status:t.status||'Watching',warmth:t.warmth||'Cold',fit:t.fit||'Maybe',
        product:t.product||'',useCase:t.use_case||'',angle:t.angle||'',
        contactName:t.contact_name||'',contactPhone:t.contact_phone||'',
        contactTitle:t.contact_title||'',referrerName:t.referrer_name||'',
        routeIn:{name:t.route_in_name||'',relationship:t.route_in_rel||'',asked:t.route_in_asked||false,result:t.route_in_result||''},
        nextStep:t.next_step||'',nextDate:t.next_date||'',
        parkReason:t.park_reason||'',icpMatch:t.icp_match||'unknown',
        icpMatchReason:t.icp_match_reason||'',
        created:t.created||'',researchLog:tLogs,aiArchive:tAiArch
      };
    });

    // AI cache as key-value map
    const cacheMap={};
    (aiCache||[]).forEach(c=>{cacheMap[c.cache_key]={text:c.response_text,date:c.cached_date,_id:c.id}});

    // Report comments as map
    const rcMap={};
    (reportComments||[]).forEach(c=>{
      if(c.is_executive) rcMap['_exec']=c.comment_text||'';
      else if(c.deal_id) rcMap[c.deal_id]=c.comment_text||'';
    });

    // Exit criteria grouped by stage
    const ecMap={};
    (exitCriteria||[]).forEach(c=>{
      if(!ecMap[c.stage_name])ecMap[c.stage_name]=[];
      ecMap[c.stage_name].push({_id:c.id,criterion:c.criterion,order:c.sort_order});
    });

    // Build D
    D={
      stages:settings.stages||DEF.stages,
      products:settings.products||DEF.products,
      productProfiles:Object.keys(ppMap).length?ppMap:DEF.productProfiles,
      partners:(productPartners||[]).map(p=>p.name),
      sources:settings.sources||DEF.sources,
      deals:assembledDeals,
      tasks:assembledTasks,
      targets:{annualTarget:settings.annual_target||4000000,fiscalYearStart:settings.fiscal_year_start||1,avgCycleDays:settings.avg_cycle_days||60,winRate:settings.win_rate||20,pipelineFrom:settings.pipeline_from||'Proposal',forecastFrom:settings.forecast_from||'Negotiation',actualRevenueFrom:settings.actual_revenue_from||'Approved'},
      partnerMargins:partnerMargins,
      referralPartners:refPartners,
      lostDeals:lostDeals||[],
      prospectTargets:assembledTargets,
      warArchive:(warArchive||[]).map(a=>({_id:a.id,text:a.analysis_text,date:a.analysis_date})),
      aiConfig:{apiKey:settings.ai_api_key||'',model:settings.ai_model||'gemini-2.5-flash',prompt:settings.ai_custom_prompt||DEF.aiConfig.prompt},
      aiCache:cacheMap,
      reportComments:rcMap,
      weekly:(weeklyMetrics||[]).map(w=>({w:w.week_label,leads:w.leads_count,qualified:w.qualified_count,closed:w.closed_count,revenue:w.revenue})),
      exitCriteria:ecMap,
      reviewNotes:(reviewNotes||[]).map(r=>({_id:r.id,dealId:r.deal_id,date:r.review_date,whatChanged:r.what_changed,nextStep:r.next_step,blocker:r.blocker,closeDateEst:r.close_date_est,note:r.reviewer_note})),
      salesPrinciples:(principles||[]).map(p=>({_id:p.id,principle:p.principle,context:p.context,source:p.source,action:p.coach_action})),
      _settingsId:settings.id
    };

    console.log('Loaded from Supabase:',D.deals.length,'deals,',D.tasks.length,'tasks,',D.prospectTargets.length,'targets');
    return true;
  }catch(err){
    console.error('Supabase load failed, using defaults:',err);
    return false;
  }
}

// ═══ SAVE HELPERS ═══
// Each save function targets a specific table to avoid rewriting everything

async function sbSaveSettings(){
  const t=D.targets;
  await sb.from('settings').update({
    annual_target:t.annualTarget,fiscal_year_start:t.fiscalYearStart,
    avg_cycle_days:t.avgCycleDays,win_rate:t.winRate,
    pipeline_from:t.pipelineFrom,forecast_from:t.forecastFrom,
    actual_revenue_from:t.actualRevenueFrom,
    stages:D.stages,products:D.products,sources:D.sources,
    ai_api_key:D.aiConfig.apiKey,ai_model:D.aiConfig.model,
    ai_custom_prompt:D.aiConfig.prompt,
    updated_at:new Date().toISOString()
  }).eq('id',D._settingsId);
}

async function sbSaveDeal(deal){
  const pp=(D.partners||[]).indexOf(deal.partner)>=0?
    await sb.from('product_partners').select('id').eq('name',deal.partner).single():null;
  const rp=deal.referralPartner?
    await sb.from('referral_partners').select('id').eq('name',deal.referralPartner).single():null;

  const row={
    company:deal.co,contact_name:deal.contact,contact_title:deal.contactTitle,
    contact_phone:deal.contactPhone,contact_email:deal.contactEmail,
    stage:deal.stage,stage_entered_date:deal.stageEnteredDate,confidence:deal.confidence,
    deal_value:deal.arr,revenue_type:deal.revenueType,
    partner_base_price:deal.partnerBasePrice||0,
    margin_pct:deal.marginPct||20,
    your_margin:deal.yourMargin||0,
    is_partner_deal:deal.isPartnerDeal,
    product_partner_id:pp?.data?.id||null,
    referral_partner_id:rp?.data?.id||null,
    referral_fee:deal.referralFee||0,
    product:deal.product,source:deal.src,
    deal_context:deal.dealContext||'',competitive:deal.competitive||'',
    win_theme:deal.winTheme||'',notes:deal.notes||'',
    icp_match:deal.icpMatch||'unknown',
    next_action:deal.nextAction||null,created:deal.created||null,
    updated_at:new Date().toISOString()
  };

  if(deal.id&&deal.id.length>10){
    // Existing deal - update
    await sb.from('deals').update(row).eq('id',deal.id);
  } else {
    // New deal - insert
    const {data}=await sb.from('deals').insert(row).select().single();
    if(data) deal.id=data.id;
  }
  return deal.id;
}

async function sbSaveTask(task){
  const row={
    title:task.title,deal_id:task.deal||null,due_date:task.due,
    priority:task.priority,status:task.status,
    updated_at:new Date().toISOString()
  };
  if(task.id&&task.id.length>10){
    await sb.from('tasks').update(row).eq('id',task.id);
  } else {
    const {data}=await sb.from('tasks').insert(row).select().single();
    if(data) task.id=data.id;
  }
  return task.id;
}

async function sbSaveStakeholder(dealId,stk){
  const row={
    deal_id:dealId,name:stk.name,title:stk.title||'',phone:stk.phone||'',
    email:stk.email||'',role:stk.role,influence:stk.influence||'medium',
    disposition:stk.disposition||'Neutral',reports_to:stk.reportsTo||''
  };
  if(stk._id){
    await sb.from('stakeholders').update(row).eq('id',stk._id);
  } else {
    const {data}=await sb.from('stakeholders').insert(row).select().single();
    if(data) stk._id=data.id;
  }
}

async function sbSaveActivity(dealId,act){
  const row={deal_id:dealId,activity_date:act.date,activity_type:act.type,note:act.note||''};
  if(act._id){
    await sb.from('activities').update(row).eq('id',act._id);
  } else {
    const {data}=await sb.from('activities').insert(row).select().single();
    if(data) act._id=data.id;
  }
}

async function sbSaveAiCache(key,text){
  const existing=D.aiCache[key];
  const row={cache_key:key,response_text:text,cached_date:today};
  if(existing&&existing._id){
    await sb.from('ai_cache').update(row).eq('id',existing._id);
  } else {
    const {data}=await sb.from('ai_cache').upsert(row,{onConflict:'cache_key'}).select().single();
    if(data) D.aiCache[key]={text,date:today,_id:data.id};
  }
}

async function sbSaveReportComment(dealId,text,isExec){
  const row={deal_id:isExec?null:dealId,comment_text:text,comment_type:'management',is_executive:isExec||false,updated_at:new Date().toISOString()};
  await sb.from('report_comments').upsert(row,{onConflict:isExec?'is_executive':'deal_id'});
}

// ═══ BRIDGE: keep save() working for existing code ═══
// The existing code calls save() everywhere. This bridges to Supabase.
// For now, save to localStorage instantly (keeps UI fast) + queue Supabase sync.
let _saveTimer=null;
function save(){
  localStorage.setItem(SK,JSON.stringify(D));
  // Debounce Supabase sync to avoid flooding
  clearTimeout(_saveTimer);
  _saveTimer=setTimeout(()=>{sbSaveSettings().catch(e=>console.warn('Settings sync:',e))},1000);
}

  if(d.revenueType==='partner_share'||d.isPartnerDeal){
    return d.yourMargin||0; // Fixed SAR markup you defined
  }
  return d.arr||0; // Own product: full deal value
}
// Net revenue = your revenue minus referral fee (fixed SAR)
function netRev(d){return expRev(d)-(d.referralFee||0)}
// Referral fee (fixed SAR amount)
function refComm(d){return d.referralFee||0}
// Annual pace tracking
function annualPace(){
  const fy=D.targets.fiscalYearStart||1;
  const now=new Date();const thisMonth=now.getMonth()+1;
  const monthsIntoFY=thisMonth>=fy?thisMonth-fy+1:12-fy+thisMonth+1;
  const monthsTotal=12;const pctThrough=monthsIntoFY/monthsTotal;
  const shouldBeAt=Math.round(D.targets.annualTarget*pctThrough);
  return{monthsIn:monthsIntoFY,pctThrough,shouldBeAt,monthsLeft:monthsTotal-monthsIntoFY};
}
const $=s=>document.querySelector(s),fc=n=>n>=1e6?`SAR ${(n/1e6).toFixed(2)}M`:n>=1e3?`SAR ${(n/1e3).toFixed(0)}K`:`SAR ${n}`;
const bd=(t,v)=>`<span class="bd ${v}">${t}</span>`,rBd=r=>r==='high'?bd(r,'rd'):r==='medium'?bd(r,'am'):bd(r,'gn');
const pBd=p=>p==='urgent'?bd(p,'rd'):p==='high'?bd(p,'am'):p==='medium'?bd(p,'bl'):bd(p,'nt');
const confBd=c=>`<span class="conf ${c==='high'?'hi':c==='medium'?'md':'lo'}">${c}</span>`;
const today=new Date().toISOString().slice(0,10),dd=(a,b)=>Math.ceil((new Date(b)-new Date(a))/864e5);
const tDone=t=>t.status==='done';
const tOverdue=t=>t.status!=='done'&&t.due<today;
const tActive=t=>t.status!=='done'&&t.due>=today;
const fd=id=>D.deals.find(d=>d.id===id);
// Stage threshold helpers
const stageIdx=s=>D.stages.indexOf(s);
const wonStage=()=>D.stages[D.stages.length-1];
const pipelineFromIdx=()=>stageIdx(D.targets.pipelineFrom)||0;
const forecastFromIdx=()=>stageIdx(D.targets.forecastFrom)||0;
const actualRevFromIdx=()=>stageIdx(D.targets.actualRevenueFrom)||D.stages.length-1;
const isActualRev=d=>stageIdx(d.stage)>=actualRevFromIdx();
const isForecast=d=>stageIdx(d.stage)>=forecastFromIdx()&&!isActualRev(d);
const isPipeline=d=>stageIdx(d.stage)>=pipelineFromIdx()&&!isForecast(d)&&!isActualRev(d);
const isEarlyStage=d=>stageIdx(d.stage)<pipelineFromIdx();
const sCt=()=>{const m={};D.stages.forEach(s=>m[s]=0);D.deals.forEach(l=>m[l.stage]++);return m};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}

// ═══ AUTO-SCORING ═══
function calcScore(d){
  if(d.stage===wonStage()) return 100;
  let s=0;
  const srcW={'Personal Referral':25,'Partner Referral':20,Inbound:15,Conference:10,'Cold Outbound':5,Other:5};s+=srcW[d.src]||10;
  const si=D.stages.indexOf(d.stage),total=D.stages.length-1;s+=Math.round((si/total)*30);
  const last=d.activities?.length?d.activities[0].date:null;
  if(last){const ago=dd(last,today);s+=ago<=3?25:ago<=7?18:ago<=14?10:ago<=21?4:0}
  const expectedDays=D.targets.avgCycleDays/D.stages.length*(si+1);const totalDays=dd(d.created,today);
  if(totalDays<=expectedDays)s+=20;else if(totalDays<=expectedDays*1.5)s+=12;else if(totalDays<=expectedDays*2)s+=5;
  return Math.min(Math.max(s,0),100);
}
function calcRisk(d){
  if(d.stage===wonStage()) return 'low';
  const score=calcScore(d);let risk=score>=70?'low':score>=45?'medium':'high';
  const last=d.activities?.length?d.activities[0].date:null;
  if(!last||dd(last,today)>14) risk='high';
  if(D.tasks.filter(t=>t.deal===d.id&&t.status!=='done').length===0 && D.stages.indexOf(d.stage)<D.stages.length-2) risk=risk==='low'?'medium':risk;
  return risk;
}
function calcUrgency(d){
  const sc=calcScore(d),rk=calcRisk(d);
  const ago=d.activities?.length?dd(d.activities[0].date,today):999;
  const overdue=D.tasks.filter(t=>t.deal===d.id&&!tDone(t)&&tOverdue(t)).length;
  return ago*2+(100-sc)+(rk==='high'?50:rk==='medium'?20:0)+overdue*30;
}
const scCl=s=>s>=70?'var(--green)':s>=45?'var(--amber)':'var(--red)';
function weightedPipeline(){return D.deals.filter(d=>d.stage!==wonStage()).reduce((s,d)=>s+d.arr*(CONF_W[d.confidence]||0.5),0)}

function nurtureSuggestion(d){
  const si=D.stages.indexOf(d.stage),total=D.stages.length,pct=si/total;
  const last=d.activities?.length?d.activities[0]:null,ago=last?dd(last.date,today):999;
  const hasMultiStk=(d.stakeholders||[]).length>1;
  const hasBlocker=(d.stakeholders||[]).some(s=>s.disposition==='Blocker');

  const isGov=d.src==='Personal Referral'||d.co.match(/ministry|government|هيئة|neom|elm|thiqah/i);
  const isCold=d.src==='Cold Outbound';const isConf=d.src==='Conference';
  const isStartup=(d.notes||'').match(/startup|fast|sme|small/i);
  const hasBudgetIssue=(d.notes||'').match(/budget|price|cost|competing|vendor/i);

  const hasContext=d.dealContext||d.competitive||d.winTheme;
  const ctxTip=hasContext?` ${d.winTheme?'Win theme: '+d.winTheme+'.':''}${d.competitive?' Competitive: '+d.competitive+'.':''}`:'';

  // CRITICAL: Stalled deals — universal priority
  if(ago>21) return {icon:"🚨",text:"This deal is dying. In Saudi business culture, silence does not mean 'no' — it means you have lost priority. Do not send another email. Call directly or send a WhatsApp voice note — this signals personal investment. If your contact is unresponsive, find a mutual connection (wasta) who can re-open the conversation."+ctxTip+prodTip,priority:"urgent"};
  if(ago>14) return {icon:"⚠",text:"Going dark for two weeks in Saudi B2B is a serious risk. Switch channels — if you have been emailing, call. If you have been calling, try WhatsApp. Send a brief, respectful voice note: 'Assalamu alaykum, I wanted to personally check in...' This signals respect and genuine interest."+ctxTip+prodTip,priority:"urgent"};
  if(ago>7) return {icon:"📞",text:"One week without contact is the warning zone. Pick up the phone — in Saudi culture, a phone call signals the relationship matters. Start with personal wellbeing before any business topic. If they mentioned a committee or approval process, ask for an update gently."+ctxTip+prodTip,priority:"high"};

  // Blocker detected
  if(hasBlocker) return {icon:"🛡",text:"You have a blocker mapped in stakeholders. In Saudi organizations, blockers are rarely confronted directly — that would cause loss of face. Instead, work through your champion to understand the blocker's concerns privately. Often the objection is not about your product but about internal politics or budget ownership. Ask your champion: 'What would make [blocker's name] comfortable with this decision?' If the blocker outranks your champion, you need a peer-level meeting — involve your own senior leadership for title-matching.",priority:"high"};

  // Early stage — Lead / Qualified
  if(pct<=0.15){
    if(isConf) return {icon:"🤝",text:"Conference lead — the relationship window is 48 hours. Send a personalized WhatsApp referencing the specific conversation at the booth: 'It was a pleasure meeting you at LEAP. Your point about [specific topic] stayed with me.' Attach a one-page Arabic/English brief, not a full deck. Saudis value personal connection over marketing material. Ask for a 20-minute coffee meeting at their office, not a formal presentation — in-person meetings are 100x more effective than virtual in KSA.",priority:"high"};
    if(isCold) return {icon:"🔍",text:"Cold outreach in Saudi Arabia has very low conversion without a warm introduction. Before your next contact, search for a mutual connection — check LinkedIn, ask your existing clients, or look within your partner network. A warm introduction from someone they trust will 10x your chances. If no connection exists, research their organization's Vision 2030 commitments and frame your outreach around their national mandate, not your product features. Use Arabic greetings even if the email is in English.",priority:"medium"};
    return {icon:"📋",text:"New lead. Saudi B2B buyers expect relationship before business. Your first meeting should be 80% listening. Identify their Vision 2030 or NTP alignment — frame your solution as an enabler of their national objectives, not a product sale. Prepare a one-page brief with Arabic executive summary."+ctxTip+prodTip,priority:"medium"};
  }

  // Discovery
  if(pct<=0.3){
    if(isGov) return {icon:"🏛",text:"Government buyer in discovery. Request a face-to-face meeting at their office — visiting them shows respect for their position. Bring Arabic business cards (English one side, Arabic the other). Start the meeting with personal conversation and accept any offered coffee or tea — declining hospitality is considered rude. Ask specifically: 'What is your internal approval process? Who are the decision makers? What documents does your procurement committee need from us?' Map their process now — Saudi government procurement involves multiple layers and knowing the path saves months.",priority:"medium"};
    if(singleThread) return {icon:"👥",text:"Single-threaded deal — high risk in KSA. Saudi business decisions are rarely made by one person. Even if your contact is the CEO, they will consult advisors, family, or trusted colleagues. Ask: 'Who else in your organization should be comfortable with this decision?' Offer to do separate briefings for technical and commercial stakeholders. In Saudi culture, involving more people is a sign of seriousness, not bureaucracy. The more people who know you, the stronger your position.",priority:"high"};
    return {icon:"💡",text:"Discovery phase. Focus on understanding their pain deeply before proposing solutions. In Saudi culture, rushing to a proposal signals desperation. Ask open-ended questions about their current challenges, what they have tried before, and what success looks like. If they mention a competitor, do not criticize — say 'They are a respected company. Let me show you where we offer additional value.'"+(pp?` Key differentiator to surface: ${pp.differentiators?.[0]||''}. Their ICP match: ${pp.icp?.split(',')[0]||''}.`:''),priority:"medium"};
  }

  if(pct<=0.5){
    if(hasBudgetIssue) return {icon:"💰",text:"Budget concerns detected. In KSA, price negotiation is expected and enjoyed — it is part of the relationship. Do not discount immediately. Instead, propose a paid pilot scoped to one department or use case. Saudi procurement committees are more comfortable approving a smaller initial commitment. Frame it as: 'Let us prove the value first, then expand.' Include an Arabic executive summary with ROI in Saudi Riyals, not abstract percentages."+(pp&&pp.commonObjections?.length?` Handle their likely objection: ${pp.commonObjections[0]}.`:''),priority:"high"};

    return {icon:"🤝",text:"Active negotiation. Involve a senior person from your side for a peer-level meeting with their decision maker. In Saudi culture, title-matching signals respect — sending a junior person to meet a senior executive is offensive. Prepare to discuss implementation in detail — Saudi buyers need confidence in your delivery capability, not just features."+ctxTip+prodTip,priority:"medium"};
  }

  // Late stage — Approved / Onboarding

  return {icon:"✅",text:"Onboarding phase. Assign a named account manager — Saudis want to know the person, not just the company. Schedule weekly check-in calls. Deliver early wins visibly — send a progress update to the executive sponsor. The first 30 days define whether this client becomes a reference and referral source."+prodTip,priority:"medium"};

// ═══ SVG CHARTS ═══
function svgBar(data,{w=460,h=150,vK='value',lK='label',maxV,threshold}={}){
  const mx=maxV||Math.max(...data.map(d=>d[vK]),1),bw=Math.min(Math.floor((w-40)/data.length)-6,40),gap=Math.floor((w-40)/data.length);
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  for(let i=0;i<=3;i++){const y=18+i*(h-48)/3;s+=`<line x1="35" y1="${y}" x2="${w-5}" y2="${y}" stroke="#e4e0d6"/><text x="30" y="${y+3}" text-anchor="end" fill="#8a92a3" font-size="9" font-family="IBM Plex Sans">${Math.round(mx-mx*i/3)}</text>`}
  data.forEach((d,i)=>{const x=40+i*gap+gap/2-bw/2,v=d[vK],bh=Math.max(v/mx*(h-48),2),y=h-30-bh;
    s+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="3" fill="${threshold&&v>threshold?'#b04540':'#1a3a52'}" opacity=".8"/><text x="${x+bw/2}" y="${h-16}" text-anchor="middle" fill="#5a6478" font-size="9" font-family="IBM Plex Sans">${d[lK]}</text><text x="${x+bw/2}" y="${y-4}" text-anchor="middle" fill="#1a1f2e" font-size="9" font-weight="600" font-family="IBM Plex Sans">${v}</text>`});
  return s+'</svg>';}

function svgLine(data,{w=460,h=140,lines=[{key:'value',color:'#1a3a52'}],lK='label'}={}){
  const allV=lines.flatMap(l=>data.map(d=>d[l.key])),mx=Math.max(...allV,1),pL=38,pR=10,pT=16,pB=28,cw=w-pL-pR,ch=h-pT-pB;
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  for(let i=0;i<=3;i++){const y=pT+i*ch/3;s+=`<line x1="${pL}" y1="${y}" x2="${w-pR}" y2="${y}" stroke="#e4e0d6"/><text x="${pL-4}" y="${y+3}" text-anchor="end" fill="#8a92a3" font-size="8" font-family="IBM Plex Sans">${fc(mx-mx*i/3)}</text>`}
  data.forEach((d,i)=>{s+=`<text x="${pL+i*(cw/(data.length-1||1))}" y="${h-6}" text-anchor="middle" fill="#8a92a3" font-size="9" font-family="IBM Plex Sans">${d[lK]}</text>`});
  lines.forEach(ln=>{const pts=data.map((d,i)=>({x:pL+i*(cw/(data.length-1||1)),y:pT+ch-d[ln.key]/mx*ch,v:d[ln.key]}));
    s+=`<path d="M${pts[0].x},${pT+ch} ${pts.map(p=>`L${p.x},${p.y}`).join(' ')} L${pts[pts.length-1].x},${pT+ch} Z" fill="${ln.color}" opacity=".06"/>`;
    s+=`<polyline points="${pts.map(p=>`${p.x},${p.y}`).join(' ')}" fill="none" stroke="${ln.color}" stroke-width="2" stroke-linejoin="round"/>`;
    pts.forEach(p=>{s+=`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${ln.color}"/><text x="${p.x}" y="${p.y-7}" text-anchor="middle" fill="${ln.color}" font-size="9" font-weight="600" font-family="IBM Plex Sans">${p.v>=1000?fc(p.v):p.v}</text>`})});
  if(lines.length>1){lines.forEach((ln,i)=>{s+=`<circle cx="${pL+i*90}" cy="${h}" r="3" fill="${ln.color}"/><text x="${pL+i*90+6}" y="${h+3}" fill="#5a6478" font-size="9">${ln.label}</text>`})}
  return s+'</svg>';}

function svgHBar(data,{w=380}={}){
  const mx=Math.max(...data.map(d=>d.value),1),bH=20,gap=6,h=data.length*(bH+gap)+8,bA=w-130;
  let s=`<svg viewBox="0 0 ${w} ${h}">`;
  data.forEach((d,i)=>{const y=4+i*(bH+gap),bw=Math.max(d.value/mx*bA,2);
    s+=`<text x="0" y="${y+bH/2+3}" fill="#1a1f2e" font-size="10" font-weight="500" font-family="IBM Plex Sans">${d.label}</text><rect x="95" y="${y}" width="${bA}" height="${bH}" rx="4" fill="#e4e0d6"/><rect x="95" y="${y}" width="${bw}" height="${bH}" rx="4" fill="${d.color||'#1a3a52'}" opacity=".75"/><text x="${97+bw+4}" y="${y+bH/2+3}" fill="#1a1f2e" font-size="10" font-weight="600" font-family="IBM Plex Sans">${d.display||d.value}</text>`});
  return s+'</svg>';}

// ═══ GEMINI AI ═══
function buildPrompt(d){
  const last=d.activities?.length?d.activities[0]:null;const ago=last?dd(last.date,today):999;
  const stks=(d.stakeholders||[]).map(s=>`${s.name} (${s.role}, ${s.disposition})`).join('; ')||'None mapped';
  const bp=(d.buyerProcess||[]).map(b=>`${b.step} [${b.status}]`).join('; ')||'Not mapped';
  const acts=(d.activities||[]).slice(0,3).map(a=>`${a.date}: ${a.type} — ${a.note}`).join('\n')||'None';
  const pp=D.productProfiles?.[d.product];
  let prodCtx='No product profile configured.';
  if(pp){prodCtx=`${pp.tagline}. ICP: ${pp.icp||'N/A'}. Differentiators: ${(pp.differentiators||[]).join(', ')}. Common objections: ${(pp.commonObjections||[]).join(' | ')}. Competitors: ${(pp.competitors||[]).join(', ')}. Saudi context: ${pp.saudiContext||'N/A'}`}
  let p=D.aiConfig.prompt;
  const vars={'{{company}}':d.co,'{{contact}}':d.contact,'{{contactTitle}}':d.contactTitle||'','{{product}}':d.product||'','{{productContext}}':prodCtx,'{{stage}}':d.stage,'{{arr}}':fc(d.arr),'{{daysSinceTouch}}':ago==='999'?'Never contacted':ago+'d','{{stakeholders}}':stks,'{{buyerProcess}}':bp,'{{notes}}':d.notes||'None','{{lastActivities}}':acts,'{{dealContext}}':d.dealContext||'Not specified','{{competitive}}':d.competitive||'Not specified','{{winTheme}}':d.winTheme||'Not specified'};
  Object.entries(vars).forEach(([k,v])=>{p=p.replaceAll(k,v)});
  return p;
}

function aiEl(dealId){const els=[document.getElementById('aid-'+dealId),document.getElementById('ai-'+dealId)];return els.find(e=>e&&e.offsetParent!==null)||els.find(e=>e)||null}
window.callGemini=async function(dealId){
  const d=fd(dealId);if(!d)return;
  if(!D.aiConfig.apiKey){toast('Add your Gemini API key in Settings first');return}
  const cached=D.aiCache[dealId];
  if(cached&&dd(cached.date,today)<1){renderAI(dealId,cached.text);return}
  const el=aiEl(dealId);
  if(el) el.innerHTML='<div style="padding:12px;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;background:#faf8f3"><span style="animation:pulse 1.5s infinite">⏳</span> Calling Gemini... Searching for real-time intelligence on <strong>'+d.co+'</strong></div>';
  const prompt=buildPrompt(d);
  try{
    const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${D.aiConfig.model}:generateContent?key=${D.aiConfig.apiKey}`,{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        contents:[{role:'user',parts:[{text:prompt}]}],
        tools:[{google_search:{}}],
        generationConfig:{temperature:0.7,maxOutputTokens:8192}
      })
    });
    if(!resp.ok){const err=await resp.text();throw new Error(err)}
    const data=await resp.json();
    let text='';
    const candidate=data.candidates?.[0];
    const parts=candidate?.content?.parts||[];
    for(const p of parts){if(p.text) text+=p.text}
    if(!text) text='No response received. Try refreshing or switching to a different model in Settings.';
    // Detect truncation
    if(candidate?.finishReason==='MAX_TOKENS') text+='\n\n⚠ **Response was truncated.** Go to Settings → AI Intelligence and try switching to gemini-2.5-pro for longer responses.';
    D.aiCache[dealId]={text,date:today};save();
    renderAI(dealId,text);
  }catch(err){
    const el2=aiEl(dealId);
    if(el2) el2.innerHTML=`<div style="padding:12px;font-size:12px;color:var(--red);border:1px solid rgba(176,69,64,.3);border-radius:6px;background:var(--rbg)"><strong>Error:</strong> ${err.message?.slice(0,300)||'Failed to reach Gemini API. Check your API key and network.'}</div>`;
  }
}

function renderAI(dealId,text){
  const el=aiEl(dealId);
  if(!el) return;
  const html=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/### (.*?)(<br>|\n)/g,'<strong style="display:block;margin-top:8px;color:var(--accent)">$1</strong>').replace(/#### (.*?)(<br>|\n)/g,'<strong style="display:block;margin-top:6px">$1</strong>').replace(/\n/g,'<br>');
  const uid='aic'+Math.random().toString(36).slice(2,8);

  el.innerHTML='<div style="border:1px solid var(--gold);border-radius:6px;background:linear-gradient(135deg,#faf8f3,#f5f0e4);border-left:3px solid var(--gold);overflow:hidden">'
    +'<div style="padding:10px 14px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid rgba(201,169,110,.25)">'
    +'<div style="font-size:10px;font-weight:600;color:var(--warm);text-transform:uppercase;letter-spacing:.06em">✦ AI Intelligence — '+new Date().toLocaleDateString('en-GB')+'</div>'
    +'<div style="display:flex;gap:4px">'
    +'<button class="rb" style="padding:3px 8px;font-size:10px;border-color:var(--gold);color:var(--warm)" onclick="var e=document.getElementById(\''+uid+'\');e.style.display=e.style.display===\'none\'?\'block\':\'none\';this.textContent=e.style.display===\'none\'?\'▼ Expand\':\'▲ Minimize\'">▲ Minimize</button>'
    +'<button class="rb" style="padding:3px 8px;font-size:10px" onclick="delete D.aiCache[\''+dealId+'\'];save();callGemini(\''+dealId+'\')">↻</button>'
    +'<button class="rb" style="padding:3px 8px;font-size:10px;border-color:var(--gold);color:var(--warm)" onclick="saveInsight(\''+dealId+'\')">📌</button>'
    +'</div></div>'
    +'<div id="'+uid+'" style="padding:12px 14px;font-size:12px;line-height:1.7;color:var(--ink)">'+html+'</div>'
    +'</div>';
}

window.saveInsight=function(dealId){
  const d=fd(dealId);if(!d)return;
  const cached=D.aiCache[dealId];if(!cached)return;
  if(!d.savedInsights)d.savedInsights=[];
  d.savedInsights.unshift({text:cached.text,date:cached.date||today});
  save();toast('Insight saved to deal');
  // Re-render to show saved badge
  const el=document.getElementById('ai-'+dealId);
  if(el){const btn=el.querySelector('[onclick*="saveInsight"]');if(btn){btn.textContent='✓ Saved';btn.style.color='var(--green)';btn.style.borderColor='var(--green)'}}
};

const VT={nur:['Nurture','Actions that drive deals toward close'],pipe:['Pipeline','Every deal across stages'],tasks:['Tasks','Stay on top of follow-ups'],tgt:['Targets','Companies to research and approach'],war:['Command','Target. Bottlenecks. Actions. Forecast.'],rev:['Revenue','Your actual income — deal by deal'],cfg:['Settings','Configure your system'],det:['',''],rpt:['Report','Management report with commentary'],lost:['Lost Deals','Learn from losses']};
let cV='nur',pF='All',tF='all';
document.querySelectorAll('.ni').forEach(b=>b.addEventListener('click',()=>sw(b.dataset.v)));
function sw(v){cV=v;document.querySelectorAll('.ni').forEach(x=>x.classList.remove('on'));document.querySelector(`.ni[data-v="${v}"]`)?.classList.add('on');document.querySelectorAll('.pnl').forEach(p=>p.classList.remove('on'));$(`#p-${v}`).classList.add('on');rv(v);uc()}
window.rv=function(v){const ph=`<div class="ph"><div><h1 class="pt">${VT[v][0]}</h1><div class="ps">${VT[v][1]}</div></div><div class="pd">${new Date().toLocaleDateString('en-GB',{weekday:'long'})}<strong>${new Date().toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'})}</strong></div></div>`;
  ({nur:rNur,pipe:rPipe,tasks:rTasks,tgt:rTgt,war:rWar,rev:rRev,cfg:rCfg,rpt:rRpt,lost:rLost})[v]?.(ph)}
function uc(){$('#nc-n').textContent=D.deals.filter(d=>d.stage!==wonStage()).length;$('#nc-p').textContent=D.deals.length;$('#nc-t').textContent=D.tasks.filter(t=>t.status!=='done').length;$('#nc-tgt').textContent=(D.prospectTargets||[]).length}
function opM(t,b,f){$('#mT').textContent=t;$('#mB').innerHTML=b;$('#mF').innerHTML=f;$('#modal').classList.add('on')}
function clM(){$('#modal').classList.remove('on')}

// ═══ NURTURE ═══
function rNur(ph){
  const active=D.deals.filter(d=>d.stage!==wonStage()).map(d=>{
    const score=calcScore(d),risk=calcRisk(d),last=d.activities?.length?d.activities[0]:null,ago=last?dd(last.date,today):999;
    const tasks=D.tasks.filter(t=>t.deal===d.id&&t.status!=='done'),overdue=tasks.filter(t=>t.due<today);
    const suggestion=nurtureSuggestion(d);
    return{...d,score,risk,lastAgo:ago,lastAct:last,openTasks:tasks,overdueTasks:overdue,suggestion,urgency:ago*2+(100-score)+(risk==='high'?50:risk==='medium'?20:0)+overdue.length*30};
  }).sort((a,b)=>b.urgency-a.urgency);

  const cold=active.filter(d=>d.lastAgo>10),cooling=active.filter(d=>d.lastAgo>5&&d.lastAgo<=10),warm=active.filter(d=>d.lastAgo<=5);

  // Today's Focus strip
  const odTasks=D.tasks.filter(t=>!tDone(t)&&tOverdue(t));
  const todayActions=active.filter(d=>d.nextAction===today);
  const daysLeft=new Date(new Date().getFullYear(),new Date().getMonth()+1,0).getDate()-new Date().getDate();
  const wonThisMonth=D.deals.filter(d=>d.stage===wonStage()).reduce((s,d)=>s+d.arr,0);
  const monthlyTarget=Math.round((D.targets.annualTarget||0)/12);const gap=monthlyTarget-wonThisMonth;

  let html=ph;
  html+='<div style="display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap">';
  html+='<div onclick="sw(\'tasks\')" style="cursor:pointer;flex:1;min-width:140px;padding:10px 14px;border-radius:6px;border:1px solid '+(odTasks.length?'rgba(176,69,64,.3)':'var(--line)')+';background:'+(odTasks.length?'var(--rbg)':'#faf8f3')+'"><div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:'+(odTasks.length?'var(--red)':'var(--ink2)')+'">Overdue Tasks</div><div style="font-size:20px;font-weight:700;font-family:Fraunces,serif;color:'+(odTasks.length?'var(--red)':'var(--green)')+'">'+odTasks.length+'</div></div>';
  html+='<div style="flex:1;min-width:140px;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:#faf8f3"><div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)">Actions Today</div><div style="font-size:20px;font-weight:700;font-family:Fraunces,serif;color:'+(todayActions.length?'var(--accent)':'var(--ink3)')+'">'+todayActions.length+'</div>'+(todayActions.length?'<div style="font-size:10px;color:var(--ink3)">'+todayActions.map(function(d){return d.co}).join(', ')+'</div>':'')+'</div>';
  html+='<div style="flex:1;min-width:140px;padding:10px 14px;border-radius:6px;border:1px solid var(--line);background:#faf8f3"><div style="font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--ink2)">Month-End Gap</div><div style="font-size:20px;font-weight:700;font-family:Fraunces,serif;color:'+(gap>0?'var(--amber)':'var(--green)')+'">'+fc(Math.max(gap,0))+'</div><div style="font-size:10px;color:var(--ink3)">'+daysLeft+'d left</div></div>';
  html+='</div>';

  html+=`<div class="sts" style="grid-template-columns:repeat(3,1fr)">
    <div class="st d"><div class="st-l">Going Cold</div><div class="st-v">${cold.length}</div><div class="st-m">No touch in 10+ days</div></div>
    <div class="st w"><div class="st-l">Cooling</div><div class="st-v">${cooling.length}</div><div class="st-m">5-10 days since touch</div></div>
    <div class="st g"><div class="st-l">Warm</div><div class="st-v">${warm.length}</div><div class="st-m">Touched within 5 days</div></div>
  </div>`;

  const renderGroup=(title,deals,accent,hint)=>{
    if(!deals.length) return '';
    return `<div style="margin-bottom:24px"><div class="sh"><h2 class="stl">${title}<span class="al" style="background:${accent}"></span></h2><span style="font-size:11px;color:var(--ink3)">${hint}</span></div>
    ${deals.map(d=>{const rkColor=d.risk==='high'?'var(--red)':d.risk==='medium'?'var(--amber)':'var(--green)';return`<div class="ac" style="border-left:4px solid ${rkColor}">
      <div class="ac-h"><div><span class="ac-t">${d.co}</span><div style="font-size:10px;color:var(--ink3);margin-top:1px">${d.contactTitle||d.contact}${d.contactPhone?' · '+d.contactPhone:''}</div></div><div style="display:flex;gap:4px">${bd(d.stage,'bl')}${bd(d.product||'','nt')}${confBd(d.confidence||'medium')}</div></div>
      <div class="ac-m">
        <span>Score: <strong style="color:${scCl(d.score)}">${d.score}</strong></span>
        <span>ARR: ${fc(d.arr)} (${d.confidence} conf)</span>
        <span>Last: ${d.lastAct?d.lastAgo+'d ago':'Never'}</span>
        ${d.openTasks.length?`<span>${d.openTasks.length} task${d.openTasks.length>1?'s':''}</span>`:'<span style="color:var(--red)">No tasks!</span>'}
        ${d.overdueTasks.length?`<span style="color:var(--red)">${d.overdueTasks.length} overdue</span>`:''}
        <span>Stakeholders: ${(d.stakeholders||[]).length}</span>
      </div>
      <div class="ac-sg"><strong>${d.suggestion.icon} Suggested action:</strong> ${d.suggestion.text}</div>
      <div style="margin-top:8px;display:flex;gap:4px;flex-wrap:wrap"><button class="rb" onclick="vDeal('${d.id}')">View Deal</button><button class="rb" onclick="actM('${d.id}')">Log Activity</button><button class="rb" onclick="taskM('','${d.id}')">Add Task</button>${d.contactPhone?`<a href="tel:${d.contactPhone}" class="rb" style="text-decoration:none">📞 Call</a><a href="https://wa.me/${d.contactPhone.replace(/[^0-9]/g,'')}" class="rb" style="text-decoration:none;color:#25D366">💬 WhatsApp</a>`:''}${D.aiConfig.apiKey?`<button class="rb" style="border-color:var(--gold);color:var(--warm)" onclick="callGemini('${d.id}')">✦ AI Insight</button>`:''}</div>
      <div id="ai-${d.id}" style="margin-top:6px"></div>
    </div>`}).join('')}</div>`;
  };

  html+=renderGroup('Going Cold — Act Now',cold,'var(--red)','These deals are dying. Phone calls and WhatsApp only.');
  html+=renderGroup('Cooling — Follow Up',cooling,'var(--amber)','Maintain momentum. Do not let these slip.');
  html+=renderGroup('Warm — On Track',warm,'var(--green)','Recently touched. Keep the pace.');
  if(!active.length) html+='<div class="empty">All deals closed.</div>';
  
  // Targets needing attention
  const tgtActions=(D.prospectTargets||[]).filter(t=>t.status!=='Parked'&&(tgtStale(t)||t.status==='Connecting'));
  if(tgtActions.length){
    html+='<div class="sh"><h2 class="stl">Targets to Touch</h2><span class="al">'+tgtActions.length+' need attention</span></div>';
    tgtActions.forEach(t=>{
      html+='<div class="ac" onclick="sw(\'tgt\');setTimeout(()=>vTgt(\''+t.id+'\'),50)" style="cursor:pointer"><div class="ac-h"><div class="ac-t">'+t.co+'</div><div>'+bd(t.status,t.status==='Connecting'?'bl':'am')+'</div></div><div class="ac-m"><span>'+t.sector+'</span><span>'+(t.nextStep||'No next step')+'</span></div></div>';
    });
  }

  $('#p-nur').innerHTML=html;
  active.forEach(d=>{const c=D.aiCache[d.id];if(c&&dd(c.date,today)<1)renderAI(d.id,c.text)});
}

// ═══ COMMAND (replaces Dashboard + War Room + Velocity) ═══
function rWar(ph){
  const active=D.deals.filter(d=>!isActualRev(d));
  const earned=D.deals.filter(d=>isActualRev(d));
  const target=D.targets.annualTarget||1;
  const sla=Math.round(D.targets.avgCycleDays/D.stages.length);
  const pace=annualPace();

  // Revenue using configurable thresholds
  const closedRev=earned.reduce((s,d)=>s+netRev(d),0);
  const committed=active.filter(d=>d.confidence==='high'&&isForecast(d));
  const forecasted=active.filter(d=>!committed.includes(d)&&(isForecast(d)||(d.confidence==='medium'&&isPipeline(d))));
  const pipeRest=active.filter(d=>!committed.includes(d)&&!forecasted.includes(d));
  const commitRev=committed.reduce((s,d)=>s+netRev(d),0);
  const forecastRev=forecasted.reduce((s,d)=>s+netRev(d),0);
  const solidTotal=closedRev+commitRev;
  const gap=Math.max(0,pace.shouldBeAt-solidTotal);
  const projectedYearEnd=Math.round(solidTotal/pace.pctThrough);

  // ── Render ──
  let html=ph;

  // Section A: The Headline — three numbers
  html+=`<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;margin-bottom:18px">
    <div class="st${solidTotal>=pace.shouldBeAt?' g':' d'}" style="cursor:pointer" onclick="sw('rev')">
      <div class="st-l">Annual Target</div>
      <div class="st-v">${fc(target)}</div>
      <div class="st-m">Closed + Committed: <strong>${fc(solidTotal)}</strong></div>
      <div style="font-size:11px;margin-top:4px;color:${solidTotal>=pace.shouldBeAt?'var(--green)':'var(--red)'}">
        ${solidTotal>=pace.shouldBeAt?'Ahead of pace ✓':fc(gap)+' behind where you should be'}
      </div>
      <div style="font-size:10px;color:var(--ink3);margin-top:2px">Month ${pace.monthsIn} of 12 · Should be at ${fc(pace.shouldBeAt)} · Projected: ${fc(projectedYearEnd)}</div>
    </div>
    <div class="st" style="cursor:default">
      <div class="st-l">Your Revenue (pipeline)</div>
      <div class="st-v">${fc(commitRev+forecastRev)}</div>
      <div class="st-m">Committed: ${fc(commitRev)} (${committed.length} deals)</div>
      <div style="font-size:10px;color:var(--ink3);margin-top:2px">Forecasted: ${fc(forecastRev)} (${forecasted.length} deals) · Early stage: ${pipeRest.length} deals not in forecast</div>
    </div>
    <div class="st${D.tasks.filter(t=>tOverdue(t)).length?' d':' g'}" style="cursor:default">
      <div class="st-l">Active Deals</div>
      <div class="st-v">${active.length}</div>
      <div class="st-m">${D.tasks.filter(t=>tOverdue(t)).length} overdue tasks · ${D.lostDeals.length} lost this year</div>
      <div style="font-size:10px;color:var(--ink3);margin-top:2px">Avg deal age: ${active.length?Math.round(active.reduce((s,d)=>s+stageDays(d),0)/active.length):0}d · Close rate needed: ${active.length?Math.round((Math.max(0,target-closedRev)/Math.max(1,active.reduce((s,d)=>s+expRev(d),0)))*100):0}%</div>
    </div>
  </div>`;

  // Section B: Bottleneck Map
  html+=`<div class="cd" style="padding:14px 16px;margin-bottom:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <h3 style="margin:0">Bottleneck Map</h3>
      <div style="display:flex;gap:10px;font-size:10px;color:var(--ink3)">
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--green);vertical-align:middle;margin-right:3px"></span>Moving</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--amber);vertical-align:middle;margin-right:3px"></span>Slowing</span>
        <span><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:var(--red);vertical-align:middle;margin-right:3px"></span>Stuck</span>
      </div>
    </div>
    <div class="bn-map">
      ${D.stages.filter(function(s){return stageIdx(s)<actualRevFromIdx()}).map(stage=>{
        const deals=active.filter(d=>d.stage===stage);
        const stageIdx=D.stages.indexOf(stage);
        const totalRevInStage=deals.reduce((s,d)=>s+expRev(d),0);
        return`<div class="bn-col">
          <div class="bn-col-head">${stage}</div>
          ${deals.length?deals.sort((a,b)=>expRev(b)-expRev(a)).map(d=>{
            const sd=stageDays(d);const health=sd>sla*1.5?'stuck':sd>sla?'slow':'ok';const rev=expRev(d);
            return`<div class="bn-deal ${health}" onclick="vDeal('${d.id}')" title="${d.co} · ${fc(rev)} your rev · ${sd}d in stage">
              <div class="bn-co">${d.co}</div>
              <div class="bn-rev">${fc(rev)}</div>
              <div class="bn-days" style="color:${health==='stuck'?'var(--red)':health==='slow'?'var(--amber)':'var(--green)'}">${sd}d</div>
            </div>`;
          }).join(''):`<div style="font-size:9px;color:var(--ink3);text-align:center;padding:12px 0">Empty</div>`}
          ${deals.length?`<div class="bn-col-count">${fc(totalRevInStage)} · ${deals.length} deal${deals.length>1?'s':''}</div>`:''}
        </div>`;
      }).join('')}
    </div>
    ${(()=>{
      // Find the biggest bottleneck
      const stageCounts=D.stages.filter(function(s){return stageIdx(s)<actualRevFromIdx()}).map(s=>({stage:s,stuck:active.filter(d=>d.stage===s&&stageDays(d)>sla*1.5),total:active.filter(d=>d.stage===s)}));
      const worst=stageCounts.filter(s=>s.stuck.length>0).sort((a,b)=>b.stuck.reduce((s,d)=>s+expRev(d),0)-a.stuck.reduce((s,d)=>s+expRev(d),0))[0];
      if(!worst) return'<div style="font-size:11px;color:var(--green);padding:4px 0">No bottlenecks detected. Pipeline is flowing.</div>';
      const stuckRev=worst.stuck.reduce((s,d)=>s+expRev(d),0);
      return`<div style="font-size:11px;color:var(--red);padding:6px 10px;background:var(--rbg);border-radius:4px;border-left:2px solid var(--red)"><strong>${fc(stuckRev)} of your revenue stuck in ${worst.stage}.</strong> ${worst.stuck.length} deal${worst.stuck.length>1?'s':''}: ${worst.stuck.map(d=>d.co).join(', ')}.</div>`;
    })()}
  </div>`;

  // Section C: Today's 3 Actions
  const actions=[];
  // Cold deals
  active.forEach(d=>{const last=d.activities?.length?d.activities[0]:null;const ago=last?dd(last.date,today):999;
    if(ago>10) actions.push({urgency:ago*expRev(d)/1000,text:`Call ${d.contact} at ${d.co} — ${ago}d without contact, ${fc(expRev(d))} at risk`,deal:d,type:'cold'});
  });
  // Overdue tasks
  D.tasks.filter(t=>tOverdue(t)).forEach(t=>{const d=fd(t.deal);if(d) actions.push({urgency:dd(t.due,today)*50,text:`"${t.title}" for ${d.co} — overdue ${dd(t.due,today)}d`,deal:d,type:'overdue'});});
  // Stalled deals
  active.filter(d=>stageDays(d)>sla*1.5).forEach(d=>{if(!actions.find(a=>a.deal.id===d.id)) actions.push({urgency:stageDays(d)*expRev(d)/5000,text:`Unblock ${d.co} — stuck ${stageDays(d)}d in ${d.stage}, ${fc(expRev(d))} revenue`,deal:d,type:'stuck'});});
  // Single-threaded
  active.filter(d=>(d.stakeholders||[]).length<=1&&D.stages.indexOf(d.stage)>=2).forEach(d=>{if(!actions.find(a=>a.deal.id===d.id)) actions.push({urgency:expRev(d)/2000,text:`Map stakeholders for ${d.co} — single-threaded, ask "${d.contact}: who else needs to be comfortable?"`,deal:d,type:'risk'});});
  actions.sort((a,b)=>b.urgency-a.urgency);

  if(actions.length){
    html+=`<div class="cd" style="border-left:3px solid var(--gold);margin-bottom:18px">
      <h3>Today's Actions</h3>
      <div class="ds">Highest impact moves, sorted by revenue at risk.</div>
      ${actions.slice(0,5).map(a=>`<div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:12px">
        <span style="font-size:14px">${a.type==='cold'?'📞':a.type==='overdue'?'⚠':a.type==='stuck'?'🔒':'👥'}</span>
        <span style="flex:1;color:var(--ink)">${a.text}</span>
        <button class="rb" onclick="vDeal('${a.deal.id}')">Go →</button>
      </div>`).join('')}
    </div>`;
  }

  // Section D: Revenue Forecast (honest)
  html+=`<div style="margin-bottom:18px"><div class="sh"><h2 class="stl">Revenue Forecast<span class="al"></span></h2><span style="font-size:11px;color:var(--ink3)">Your revenue, not deal value</span></div>
  <div class="wr-forecast">
    <div class="wr-fc commit"><h4>Committed</h4><div style="font-size:10px;color:var(--ink3)">High confidence, late stage — evidence of yes</div><div class="total">${fc(commitRev)}</div>
      <div class="deal-list">${committed.length?committed.map(d=>`<div class="deal-item" onclick="vDeal('${d.id}')"><span>${d.co}</span><span>${fc(expRev(d))} <span style="color:var(--ink3);font-size:9px">(deal: ${fc(d.arr)})</span></span></div>`).join(''):'<div style="font-size:11px;color:var(--ink3);padding:8px 0">None</div>'}</div></div>
    <div class="wr-fc best"><h4>Forecasted</h4><div style="font-size:10px;color:var(--ink3)">Active engagement, post-discovery</div><div class="total">${fc(forecastRev)}</div>
      <div class="deal-list">${forecasted.length?forecasted.map(d=>`<div class="deal-item" onclick="vDeal('${d.id}')"><span>${d.co}</span><span>${fc(expRev(d))}</span></div>`).join(''):'<div style="font-size:11px;color:var(--ink3);padding:8px 0">None</div>'}</div></div>
    <div class="wr-fc pipe"><h4>Early Stage</h4><div style="font-size:10px;color:var(--ink3)">Not in forecast — feeds future quarters</div><div class="total" style="color:var(--ink3)">${fc(pipeRest.reduce((s,d)=>s+expRev(d),0))}</div>
      <div class="deal-list">${pipeRest.length?pipeRest.map(d=>`<div class="deal-item" onclick="vDeal('${d.id}')"><span>${d.co}</span><span style="color:var(--ink3)">${fc(expRev(d))}</span></div>`).join(''):'<div style="font-size:11px;color:var(--ink3);padding:8px 0">None</div>'}</div></div>
  </div></div>`;

  // Section E: Gemini Strategic Intelligence (collapsed by default)
  html+=`<div class="cd" style="border-left:3px solid var(--gold)">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <h3>✦ Strategic Intelligence</h3>
      <div style="display:flex;gap:4px">
        ${D.aiConfig.apiKey?`<button class="btn gl sm" onclick="callWarGemini()">✦ Analyze Pipeline</button>`:'<span style="font-size:10px;color:var(--amber)">Add API key in Settings</span>'}
        <button class="rb" style="font-size:10px" onclick="var e=document.getElementById('war-ai-body');e.style.display=e.style.display==='none'?'block':'none';this.textContent=e.style.display==='none'?'▼ Expand':'▲ Minimize'">${D.aiCache._war?'▲ Minimize':'▼ Expand'}</button>
      </div>
    </div>
    <div id="war-ai-body" style="display:${D.aiCache._war?'block':'none'};margin-top:10px">
      <div id="ai-war"></div>
    </div>
  </div>`;

  // Section F: Archive
  const archive=D.warArchive||[];
  if(archive.length){
    html+=`<div class="cd" style="margin-top:14px"><h3>📌 Previous Analyses (${archive.length})</h3>
    ${archive.slice(0,5).map((a,i)=>{const uid='wa-'+i;return`<div style="border:1px solid var(--line);border-radius:5px;margin-top:4px;overflow:hidden">
      <div style="padding:6px 10px;display:flex;justify-content:space-between;align-items:center;background:#faf8f3;cursor:pointer;font-size:10px" onclick="var e=document.getElementById('${uid}');e.style.display=e.style.display==='none'?'block':'none'">
        <span style="color:var(--warm);font-weight:600">${a.date}</span>
        <button class="rb" style="padding:1px 5px;font-size:9px" onclick="event.stopPropagation();D.warArchive.splice(${i},1);save();rv('war')">×</button>
      </div>
      <div id="${uid}" style="display:none;padding:10px;font-size:11px;line-height:1.6">${a.text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>')}</div>
    </div>`}).join('')}</div>`;
  }

  
  // Target pipeline health
  const tgtActive=(D.prospectTargets||[]).filter(t=>t.status!=='Parked');
  const tgtReady=tgtActive.filter(t=>t.status==='Connecting'||t.status==='Approached');
  if(tgtActive.length){
    html+='<div class="cd" style="border-left:3px solid var(--gold);margin-top:14px"><h3 style="font-size:14px;margin-bottom:6px">Target Pipeline</h3>';
    html+='<div style="font-size:13px">'+tgtActive.length+' active targets · '+tgtReady.length+' ready to approach</div>';
    if(tgtReady.length)html+='<div style="font-size:12px;color:var(--ink2);margin-top:4px">Converting '+Math.min(tgtReady.length,2)+' this week would add to pipeline.</div>';
    html+='</div>';
  }

  $('#p-war').innerHTML=html;
  const wc=D.aiCache._war;if(wc&&dd(wc.date,today)<1)renderWarAI(wc.text);
}

// War Room AI rendering
function renderWarAI(text){
  const el=document.getElementById('ai-war');if(!el) return;
  const html=text.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\n/g,'<br>');
  el.innerHTML=`<div style="border:1px solid var(--gold);border-radius:6px;background:linear-gradient(135deg,#faf8f3,#f5f0e4);border-left:3px solid var(--gold);padding:14px;font-size:12px;line-height:1.7;color:var(--ink)">
    <div style="display:flex;justify-content:space-between;margin-bottom:8px"><span style="font-size:10px;font-weight:600;color:var(--warm)">✦ ${new Date().toLocaleDateString('en-GB')}</span>

window.saveWarInsight=function(){
  const c=D.aiCache._war;if(!c){toast('Nothing to save');return}
  if(!D.warArchive)D.warArchive=[];D.warArchive.unshift({text:c.text,date:c.date||today});
  if(D.warArchive.length>10)D.warArchive=D.warArchive.slice(0,10);
  save();toast('Saved to archive');rv('war');
};

window.callWarGemini=async function(){
  if(!D.aiConfig.apiKey){toast('Add API key in Settings');return}
  const active2=D.deals.filter(d=>!isActualRev(d));
  document.getElementById('war-ai-body').style.display='block';
  const el=document.getElementById('ai-war');
  if(el) el.innerHTML='<div style="padding:12px;font-size:12px;color:var(--ink2);border:1px solid var(--line);border-radius:6px;background:#faf8f3"><span style="animation:pulse 1.5s infinite">⏳</span> Analyzing pipeline...</div>';
  const sums=active2.map(d=>`${d.co}|${d.stage}|Deal:${fc(d.arr)} Your:${fc(expRev(d))}|${d.confidence}conf|Score:${calcScore(d)}|${stageDays(d)}d in stage|${(d.stakeholders||[]).length}stk|${d.product}|${d.isPartnerDeal?'Partner:'+d.partner:'Direct'}|${d.dealContext||d.notes||''}`).join('\n');
  const prompt=`You are a Saudi Arabia B2B SaaS sales strategist. Analyze my pipeline.\n\nPIPELINE (${active2.length} deals, annual target: ${fc(D.targets.annualTarget)}):\n${sums}\n\nClosed this year: ${fc(D.deals.filter(d=>d.stage===ws).reduce((s,d)=>s+expRev(d),0))}\nLost this year: ${D.lostDeals.length} deals\n\n4 sections:\n1. **This Week's Priority** — 2-3 deals for max revenue impact. One action per deal.\n2. **Portfolio Risk** — Systemic patterns. Bottlenecks. Dependencies.\n3. **Missed Opportunity** — Cross-sell, upsell, strategic move?\n4. **Forecast Reality** — Will I hit target? Honest. What needs to happen?\n\nBe direct. Name companies. KSA SaaS SME context.`;
  try{
    const resp=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${D.aiConfig.model}:generateContent?key=${D.aiConfig.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{role:'user',parts:[{text:prompt}]}],tools:[{google_search:{}}],generationConfig:{temperature:0.7,maxOutputTokens:8192}})});
    if(!resp.ok) throw new Error(await resp.text());
    const data=await resp.json();let text='';(data.candidates?.[0]?.content?.parts||[]).forEach(p=>{if(p.text)text+=p.text});

    D.aiCache._war={text,date:today};save();renderWarAI(text);

};
